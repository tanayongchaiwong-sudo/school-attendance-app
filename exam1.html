<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>แบบทดสอบก่อนเข้าห้อง (Pre-Clinic)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        :root { 
            --primary: #ec4899; 
            --primary-hover: #db2777; 
            --bg: #fdf2f8; 
            --text: #1f2937; 
            --border: #fbcfe8;
        }
        
        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            padding: 15px; 
            color: var(--text); 
        }
        
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: white; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.1); 
        }
        
        /* ส่วนหัวข้อสอบ */
        .header { 
            text-align: center; 
            margin-bottom: 25px; 
            border-bottom: 2px dashed var(--border); 
            padding-bottom: 20px; 
        }
        .header i { 
            font-size: 40px; 
            color: var(--primary); 
            margin-bottom: 10px; 
        }
        .header h2 { 
            margin: 0; 
            font-size: 22px; 
            font-weight: 600; 
            color: #9d174d; 
        }
        .header p { 
            margin: 8px 0 0; 
            font-size: 15px; 
            color: #db2777; 
            font-weight: 500; 
            background: #fce7f3; 
            display: inline-block; 
            padding: 6px 16px; 
            border-radius: 20px; 
        }
        
        /* การ์ดข้อสอบ */
        .question-card { 
            background: #fff; 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            border: 1px solid var(--border); 
            box-shadow: 0 2px 8px rgba(0,0,0,0.02); 
        }
        .question-title { 
            font-size: 16px; 
            font-weight: 600; 
            margin: 0 0 15px 0; 
            color: #be185d; 
            line-height: 1.5; 
        }
        
        /* รูปภาพประกอบคำถาม */
        .question-image { 
            text-align: center; 
            margin-bottom: 15px; 
        }
        .question-image img { 
            max-width: 100%; 
            max-height: 250px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            border: 1px solid var(--border); 
        }
        
        /* ตัวเลือก (ช้อยส์) */
        .option-label { 
            display: flex; 
            align-items: flex-start; 
            background: #fdf2f8; 
            padding: 12px 15px; 
            border-radius: 8px; 
            margin-bottom: 10px; 
            border: 1px solid var(--border); 
            cursor: pointer; 
            transition: 0.2s; 
            font-size: 15px; 
            color: #4b5563; 
        }
        .option-label:hover { 
            background: #fce7f3; 
            border-color: #f9a8d4; 
        }
        .option-label input[type="radio"] { 
            margin-right: 12px; 
            margin-top: 3px; 
            accent-color: var(--primary); 
            transform: scale(1.2); 
        }
        .option-text { 
            flex: 1; 
        }
        .option-text img { 
            max-width: 130px; 
            border-radius: 6px; 
            margin-top: 5px; 
            display: block; 
            border: 1px solid #e5e7eb; 
        }

        /* ปุ่มส่งข้อสอบ */
        .btn-submit { 
            width: 100%; 
            padding: 15px; 
            font-family: 'Prompt', sans-serif; 
            font-weight: 600; 
            font-size: 16px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            margin-top: 15px; 
            box-shadow: 0 4px 6px rgba(236, 72, 153, 0.3); 
            transition: 0.3s; 
        }
        .btn-submit:hover { 
            background: var(--primary-hover); 
            transform: translateY(-2px); 
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container" id="loadingDiv" style="text-align: center; padding: 50px 20px;">
    <i class="fa-solid fa-spinner fa-spin" style="font-size: 45px; color: #ec4899; margin-bottom: 15px;"></i>
    <p style="font-size: 16px; color: #4b5563;">กำลังเตรียมข้อสอบ และดึงข้อมูลนักเรียน...</p>
</div>

<div class="container hidden" id="quizContainer">
    <div class="header">
        <i class="fa-solid fa-laptop-medical"></i>
        <h2>แบบทดสอบก่อนเข้าห้อง</h2>
        <p id="examPartTitle">กำลังโหลด...</p>
    </div>

    <input type="hidden" id="studentId">
    <input type="hidden" id="studentName">

    <div id="questionsArea"></div>

    <button class="btn-submit" onclick="submitExam()">
        <i class="fa-solid fa-check-double"></i> ส่งคำตอบและตรวจคะแนน
    </button>
</div>

<script>
    // 🚨 1. ใส่ LIFF ID ที่สร้างสำหรับหน้าข้อสอบตรงนี้
    const LIFF_ID = "ใส่_LIFF_ID_หน้าข้อสอบ_ที่นี่"; 
    
    // 🚨 2. URL ของระบบหลังบ้าน Google Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbxZ_QTWpnCGkwMO85TQOysJyR0L9LNggOpK3cAhH4udynOR4yHIJBPf0KjlmaI8tpx-/exec"; 

    // ==========================================
    // 📝 คลังข้อสอบ Pre-Clinic Part 1
    // ==========================================
    const quizData = {
        "Part 1: การใช้เครื่องมือ-อุปกรณ์การถ่ายภาพรังสีในช่องปาก": [
            { 
                q: "1. แผ่นรับภาพรังสีมีกี่ขนาดและอะไรบ้าง?", 
                image: "", 
                options: [
                    "ก. 4 ขนาด ได้แก่ เบอร์ 1, 2, 3 และ 4", 
                    "ข. 4 ขนาด ได้แก่ เบอร์ 0, 1, 2 และ 3", 
                    "ค. 5 ขนาด ได้แก่ เบอร์ 1, 2, 3, 4 และ 5", 
                    "ง. 5 ขนาด ได้แก่ เบอร์ 0, 1, 2, 3 และ 4"
                ], 
                answer: 3 
            },
            { 
                q: "2. ผู้ป่วยเด็กควรใช้แผ่นรับภาพรังสีขนาดอะไร?", 
                image: "", 
                options: [
                    "ก. เบอร์ 0", 
                    "ข. เบอร์ 4", 
                    "ค. เบอร์ 2", 
                    "ง. เบอร์ 3"
                ], 
                answer: 0 
            },
            { 
                q: "3. แผ่นรับภาพรังสีขนาดใดที่นิยมใช้งานมากที่สุด?", 
                image: "", 
                options: [
                    "ก. เบอร์ 0", 
                    "ข. เบอร์ 4", 
                    "ค. เบอร์ 2", 
                    "ง. เบอร์ 3"
                ], 
                answer: 2 
            },
            { 
                q: "4. SNAP A-RAY ใช้ถ่ายภาพรังสีกับฟันบริเวณใด?", 
                image: "", 
                options: [
                    "ก. ฟันหน้า", 
                    "ข. ฟันหลัง", 
                    "ค. ฟันคุด", 
                    "ง. ฟันหน้าและฟันหลัง"
                ], 
                answer: 3 
            },
            { 
                q: "5. การถ่ายภาพรังสีของฟันหน้า ต้องวางแผ่นรับภาพแนวไหนและเพราะอะไร?", 
                image: "", 
                options: [
                    "ก. วางแนวตั้ง เพราะ ใส่ง่ายกว่าแนวนอน", 
                    "ข. วางแนวตั้ง เพราะ รากฟันด้านหน้ามีลักษณะยาว", 
                    "ค. วางแนวนอน เพราะ ใส่ง่ายกว่าแนวตั้ง", 
                    "ง. วางแนวนอน เพราะ รากฟันด้านหน้ามีลักษณะสั้น"
                ], 
                answer: 1 
            },
            { 
                q: "6. Horizontal Bitewing มีการวางแผ่นรับภาพแบบใด และใช้ประเมินดูอะไร?", 
                image: "", 
                options: [
                    "ก. วางแนวตั้ง เพื่อประเมินดูกระดูกและเหงือก", 
                    "ข. วางแนวตั้ง เพื่อประเมินดูรอยผุด้านประชิดของฟัน", 
                    "ค. วางแนวนอน เพื่อประเมินดูกระดูกและเหงือก", 
                    "ง. วางแนวนอน เพื่อประเมินดูรอยผุ ด้านประชิดของฟัน"
                ], 
                answer: 3 
            },
            { 
                q: "7. จากภาพแผ่นรับภาพรังสี ตำแหน่งไหนคือ DOT?", 
                image: "https://i.postimg.cc/h4spn6CF/Film.jpg", 
                options: [
                    "ก. ตำแหน่งที่ 1", 
                    "ข. ตำแหน่งที่ 2", 
                    "ค. ตำแหน่งที่ 3", 
                    "ง. ตำแหน่งที่ 4"
                ], 
                answer: 0 
            },
            { 
                q: "8. อุปกรณ์ HANSHIN คือข้อใด?", 
                image: "", 
                options: [
                    "ก. <br><img src='https://i.postimg.cc/jqcZTmMp/xcp-A.jpg'>", 
                    "ข. <br><img src='https://i.postimg.cc/3Jw9x1qc/Snap.jpg'>", 
                    "ค. <br><img src='https://i.postimg.cc/qBwjrSmr/Xcp-Bw.jpg'>", 
                    "ง. <br><img src='https://i.postimg.cc/44PBGq8Z/Hchin.png'>"
                ], 
                answer: 3 
            },
            { 
                q: "9. อุปกรณ์ XCP สำหรับถ่ายฟันหน้า คือข้อใด?", 
                image: "", 
                options: [
                    "ก. <br><img src='https://i.postimg.cc/jqcZTmMp/xcp-A.jpg'>", 
                    "ข. <br><img src='https://i.postimg.cc/3Jw9x1qc/Snap.jpg'>", 
                    "ค. <br><img src='https://i.postimg.cc/qBwjrSmr/Xcp-Bw.jpg'>", 
                    "ง. <br><img src='https://i.postimg.cc/44PBGq8Z/Hchin.png'>"
                ], 
                answer: 0 
            },
            { 
                q: "10. อุปกรณ์ SNAP A-RAY คือข้อใด?", 
                image: "", 
                options: [
                    "ก. <br><img src='https://i.postimg.cc/jqcZTmMp/xcp-A.jpg'>", 
                    "ข. <br><img src='https://i.postimg.cc/3Jw9x1qc/Snap.jpg'>", 
                    "ค. <br><img src='https://i.postimg.cc/qBwjrSmr/Xcp-Bw.jpg'>", 
                    "ง. <br><img src='https://i.postimg.cc/44PBGq8Z/Hchin.png'>"
                ], 
                answer: 1 
            }
        ],

        // สำรองพื้นที่สำหรับ Part 2 และ Part 3
        "Part 2": [],
        "Part 3": []
    };

    // ==========================================
    // ⚙️ ระบบประมวลผลและการทำงานเบื้องหลัง
    // ==========================================
    let currentPartKey = "";
    let currentQuestions = [];

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        let partParam = urlParams.get('part') || "Part 1";

        // ค้นหาพาร์ทที่ตรงกันใน quizData
        currentPartKey = Object.keys(quizData).find(key => key.includes(partParam)) || "Part 1: การใช้เครื่องมือ-อุปกรณ์การถ่ายภาพรังสีในช่องปาก";
        currentQuestions = quizData[currentPartKey];

        if (!currentQuestions || currentQuestions.length === 0) {
            Swal.fire('ข้อผิดพลาด', 'ไม่พบชุดข้อสอบ หรือลิงก์ไม่ถูกต้อง\nกรุณาเข้าทำข้อสอบผ่านศูนย์บริการนักเรียนครับ', 'error');
            return;
        }

        document.getElementById("examPartTitle").innerText = currentPartKey.split(":")[0];

        // เชื่อมต่อ LINE LIFF เพื่อดึงข้อมูลนักเรียน
        liff.init({ liffId: LIFF_ID }).then(() => {
            if (liff.isLoggedIn()) {
                liff.getProfile().then(p => { 
                    fetchStudentData(p.userId); 
                });
            } else {
                liff.login();
            }
        }).catch(() => {
            Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อ LINE LIFF ได้', 'error');
        });
    };

    function fetchStudentData(uid) {
        fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getStudentDashboard", studentUid: uid }) })
        .then(res => res.json()).then(data => {
            if(data.status === "success") {
                document.getElementById("studentId").value = data.data.studentId;
                document.getElementById("studentName").value = data.data.studentName;
                renderQuestions();
            } else {
                Swal.fire('ข้อผิดพลาด', 'ไม่พบบัญชีนักเรียนของคุณ กรุณาลงทะเบียนเข้าระบบก่อนครับ', 'error');
            }
        }).catch(() => {
            Swal.fire('ข้อผิดพลาด', 'เกิดข้อผิดพลาดในการโหลดข้อมูลนักเรียน', 'error');
        });
    }

    function renderQuestions() {
        let html = "";
        currentQuestions.forEach((q, idx) => {
            html += `<div class="question-card">
                        <h3 class="question-title">${q.q}</h3>`;
            
            if (q.image && q.image.trim() !== "") {
                html += `<div class="question-image">
                            <img src="${q.image}" alt="ภาพประกอบข้อสอบ">
                         </div>`;
            }

            q.options.forEach((opt, oIdx) => {
                html += `<label class="option-label">
                            <input type="radio" name="q${idx}" value="${oIdx}"> 
                            <div class="option-text">${opt}</div>
                         </label>`;
            });

            html += `</div>`;
        });
        
        document.getElementById("questionsArea").innerHTML = html;
        document.getElementById("loadingDiv").classList.add("hidden");
        document.getElementById("quizContainer").classList.remove("hidden");
    }

    function submitExam() {
        let correctCount = 0;
        let isComplete = true;
        let totalQuestions = currentQuestions.length;

        currentQuestions.forEach((q, idx) => {
            let selected = document.querySelector(`input[name="q${idx}"]:checked`);
            if (!selected) { 
                isComplete = false; 
            } else if (parseInt(selected.value) === q.answer) { 
                correctCount++; 
            }
        });

        if (!isComplete) {
            return Swal.fire('แจ้งเตือน', 'กรุณาตอบคำถามให้ครบถ้วนทุกข้อก่อนส่งครับ', 'warning');
        }

        // คำนวณคะแนนปรับเป็นฐานเต็ม 10 อัตโนมัติ
        let finalScore = (correctCount / totalQuestions) * 10;
        finalScore = Math.round(finalScore * 10) / 10; 

        Swal.fire({
            title: 'ยืนยันส่งข้อสอบ?',
            text: "หากส่งคำตอบแล้วจะไม่สามารถกลับมาแก้ไขได้อีก",
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#ec4899',
            cancelButtonColor: '#9ca3af',
            confirmButtonText: 'ยืนยันการส่ง',
            cancelButtonText: 'ยกเลิก'
        }).then((result) => {
            if (result.isConfirmed) {
                Swal.fire({ title: 'กำลังตรวจคำตอบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

                let payload = {
                    action: "submitAutoExamScore",
                    studentId: document.getElementById("studentId").value,
                    studentName: document.getElementById("studentName").value,
                    part: "Part 1",
                    score: finalScore
                };

                fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
                .then(res => res.json()).then(data => {
                    if(data.status === "success") {
                        Swal.fire({
                            icon: 'success',
                            title: 'สอบเสร็จสิ้น! 🎉',
                            html: `ทำถูก: <b>${correctCount}</b> / ${totalQuestions} ข้อ<br><br>คิดเป็นคะแนน: <b style="color:#ec4899; font-size:22px;">${finalScore}</b> / 10<br><br><span style="font-size:13px; color:#6b7280;">(ระบบได้บันทึกคะแนนของคุณเรียบร้อยแล้ว)</span>`,
                            confirmButtonColor: '#ec4899',
                            confirmButtonText: 'ปิดหน้าต่าง'
                        }).then(() => {
                            liff.closeWindow();
                        });
                    } else {
                        Swal.fire('ข้อผิดพลาด', data.message, 'error');
                    }
                }).catch(() => {
                    Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้', 'error');
                });
            }
        });
    }
</script>

</body>
</html>
