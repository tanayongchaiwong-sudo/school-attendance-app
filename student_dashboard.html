<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ข้อมูลของฉัน (Dashboard)</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <style>
        body { font-family: 'Prompt', sans-serif; background: #f8fafc; margin: 0; padding: 15px; color: #1e293b; }
        .container { max-width: 480px; margin: 0 auto; padding-bottom: 25px;}
        
        .profile-card { background: linear-gradient(135deg, #6366f1, #3b82f6); color: white; padding: 25px 20px; border-radius: 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.25); margin-bottom: 20px; position: relative;}
        .profile-card img { width: 65px; height: 65px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.8); object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
        .profile-info { flex: 1; }
        .profile-info h2 { margin: 0 0 4px 0; font-size: 18px; font-weight: 600; line-height: 1.2;}
        .profile-info p { margin: 0; font-size: 13px; opacity: 0.9;}
        .edit-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.2); color: white; border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .edit-btn:hover { background: rgba(255,255,255,0.3); transform: rotate(15deg); }
        
        .secondary-stats { display: flex; gap: 12px; margin-bottom: 20px; }
        .sec-box { flex: 1; background: #f1f5f9; padding: 12px 15px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: #64748b; font-weight: 500; border: 1px solid #e2e8f0; }
        .sec-box i { color: #94a3b8; font-size: 16px;}
        .sec-box span { font-weight: 600; color: #334155; font-size: 15px;}
        .sec-box.warning span { color: #ef4444; }

        /* 🌟 CSS เพิ่มเติมสำหรับปุ่มกดกล่องมาสาย */
        .clickable-sec-box { cursor: pointer; transition: 0.3s; position: relative; }
        .clickable-sec-box:hover, .clickable-sec-box:active { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(239, 68, 68, 0.15); border-color: #fca5a5; background: #fff5f5; }

        .primary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 25px; }
        .action-card { background: white; padding: 18px 10px; border-radius: 16px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.04); cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid #f1f5f9; display: flex; flex-direction: column; align-items: center;}
        .action-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
        
        .action-card.c-green { border-bottom: 3px solid #10b981; }
        .action-card.c-blue { border-bottom: 3px solid #3b82f6; }
        .action-card.c-pink { border-bottom: 3px solid #ec4899; }
        
        .icon-circle { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .c-green .icon-circle { background: #d1fae5; color: #10b981; }
        .c-blue .icon-circle { background: #dbeafe; color: #3b82f6; }
        .c-pink .icon-circle { background: #fce7f3; color: #ec4899; }
        .icon-circle i { font-size: 20px; }

        .action-num { font-size: 22px; font-weight: 600; color: #1e293b; line-height: 1; margin-bottom: 4px;}
        .action-label { font-size: 12px; color: #64748b; font-weight: 500; }

        .card-box { background: white; padding: 22px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); border: 1px solid #f1f5f9; margin-bottom: 25px;}
        .card-box h3 { margin: 0 0 18px 0; font-size: 16px; display: flex; align-items: center; gap: 10px; color: #0f766e; font-weight: 600;}
        .card-box h3 i { background: #ccfbf1; padding: 8px; border-radius: 8px; color: #0d9488;}
        
        .progress-container { margin-bottom: 20px; }
        .progress-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #475569;}
        .progress-bar-bg { width: 100%; height: 12px; background: #e2e8f0; border-radius: 12px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #10b981, #34d399); width: 0%; transition: width 1s ease-in-out; border-radius: 12px;}
        
        .goal-section-title { font-size: 12px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; margin-top: 15px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 5px;}
        .goal-list { display: flex; flex-direction: column; gap: 8px; }
        .goal-item { background: #f8fafc; padding: 10px 15px; border-radius: 10px; font-size: 13px; color: #334155; display: flex; justify-content: space-between; align-items: center; border: 1px solid #f1f5f9;}
        .goal-item.done { background: #f0fdf4; border-color: #bbf7d0; color: #065f46; }
        .goal-item-title { display: flex; align-items: center; gap: 8px; font-weight: 500;}
        .goal-item.done .goal-item-title i { color: #10b981; }
        .goal-item-status { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 10px; }
        .goal-item.done .goal-item-status { background: #d1fae5; color: #047857; }

        .history-card { background: white; padding: 22px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); border: 1px solid #f1f5f9;}
        .history-card h3 { margin: 0 0 15px 0; font-size: 16px; display: flex; align-items: center; gap: 10px; color: #4338ca; font-weight: 600;}
        .history-card h3 i { background: #e0e7ff; padding: 8px; border-radius: 8px; color: #4f46e5;}
        
        .history-item { padding: 15px 0; border-bottom: 1px dashed #e2e8f0; display: flex; justify-content: space-between; align-items: flex-start; }
        .history-item:last-child { border: none; padding-bottom: 0; }
        .h-title { font-size: 14px; font-weight: 600; color: #1e293b; margin-bottom: 4px; display: flex; align-items: center; gap: 6px;}
        .h-date { font-size: 11px; color: #94a3b8; display: flex; align-items: center; gap: 4px;}
        
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;}
        .status-Submitted { background: #d1fae5; color: #047857; } 
        .status-Rejected { background: #fee2e2; color: #b91c1c; }
        .status-Pending { background: #fef08a; color: #b45309; }
        
        .h-reason-box { margin-top: 8px; background: #fff1f2; padding: 10px; border-radius: 8px; border-left: 3px solid #ef4444; width: 100%; box-sizing: border-box;}
        .h-reason-text { font-size: 12px; color: #991b1b; font-weight: 500; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 6px;}
        
        .btn-resubmit { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-family: 'Prompt'; font-size: 12px; cursor: pointer; transition: 0.2s; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; width: 100%; justify-content: center;}
        .btn-resubmit:hover { background: #dc2626; transform: translateY(-1px); box-shadow: 0 4px 6px rgba(239, 68, 68, 0.2); }
        
        .swal-wide { width: 95% !important; max-width: 500px !important; border-radius: 20px; padding: 20px 10px; }
        .swal-title-custom { font-family: 'Prompt'; font-size: 18px; font-weight: 600; color: #1e293b; margin-bottom: 15px;}
        
        .detail-list { display: flex; flex-direction: column; gap: 10px; max-height: 50vh; overflow-y: auto; padding-right: 5px; text-align: left;}
        .detail-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 15px; display: flex; flex-direction: column; gap: 8px;}
        .dc-header { display: flex; justify-content: space-between; align-items: center;}
        .dc-title { font-size: 14px; font-weight: 600; color: #334155;}
        .dc-status { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 12px;}
        .dc-status.done { background: #d1fae5; color: #047857; } 
        .dc-status.todo { background: #f1f5f9; color: #64748b; }
        
        .att-table { width: 100%; border-collapse: collapse; font-size: 13px;}
        .att-table th { padding: 12px 10px; background: #f1f5f9; color: #475569; font-weight: 600; position: sticky; top: 0; z-index: 10;}
        .att-table th:first-child { border-radius: 10px 0 0 10px; }
        .att-table th:last-child { border-radius: 0 10px 10px 0; }
        .att-table td { padding: 12px 10px; border-bottom: 1px dashed #e2e8f0; color: #334155;}
        .att-time { font-weight: 600; }
        .att-time.in { color: #10b981; }
        .att-time.out { color: #f59e0b; }
        .att-hours { color: #4f46e5; font-weight: 600; background: #e0e7ff; padding: 2px 6px; border-radius: 6px;}

        ::-webkit-scrollbar { width: 6px; height: 6px;}
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>
<div class="container" id="loadingDiv" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh;">
    <i class="fa-solid fa-spinner fa-spin" style="font-size: 45px; color: #4f46e5; margin-bottom: 15px;"></i>
    <div style="font-size: 14px; color: #64748b; font-weight: 500;">กำลังโหลดข้อมูลของคุณ...</div>
</div>

<div class="container" id="mainDiv" style="display:none;">
    
    <div class="profile-card">
        <button class="edit-btn" onclick="openEditModal()"><i class="fa-solid fa-pen"></i></button>
        <img id="userImg" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile">
        <div class="profile-info">
            <h2 id="userName">กำลังโหลด...</h2>
            <p id="userGroup">รหัส: - | กลุ่ม: -</p>
        </div>
    </div>
    
    <div class="secondary-stats">
        <div class="sec-box"><i class="fa-solid fa-hourglass-half"></i> สะสม: <span id="sHours">0</span> ชม.</div>
        <!-- 🌟 เพิ่มคลาส clickable-sec-box และฟังก์ชัน onclick ตรงนี้ -->
        <div class="sec-box warning clickable-sec-box" onclick="showLateDetails()" title="คลิกเพื่อดูประวัติการมาสาย">
            <i class="fa-solid fa-triangle-exclamation"></i> มาสาย: <span id="sLate">0</span> ครั้ง
        </div>
    </div>

    <div class="primary-grid">
        <div class="action-card c-green" onclick="showAttendanceDetails()">
            <div class="icon-circle"><i class="fa-solid fa-calendar-check"></i></div>
            <div class="action-num" id="sCheckin">0</div>
            <div class="action-label">เข้างาน (วัน)</div>
        </div>
        <div class="action-card c-blue" onclick="showAssignmentDetails()">
            <div class="icon-circle"><i class="fa-solid fa-file-arrow-up"></i></div>
            <div class="action-num" id="sAssign">0</div>
            <div class="action-label">ส่งงาน (ชิ้น)</div>
        </div>
        <div class="action-card c-pink" onclick="showExamDetails()">
            <div class="icon-circle"><i class="fa-solid fa-graduation-cap"></i></div>
            <div class="action-num" id="sExam">0</div>
            <div class="action-label">สอบ (เรื่อง)</div>
        </div>
    </div>
    
    <div class="card-box">
        <h3><i class="fa-solid fa-trophy"></i> เป้าหมายสู่ความสำเร็จของห้องรังสีฯ</h3>
        <div class="progress-container">
            <div class="progress-header">
                <span>ความคืบหน้า (รายการหลัก)</span>
                <span id="progressText" style="color: #059669;">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>
        <div id="goalListArea"></div>
    </div>

    <div class="history-card">
        <h3><i class="fa-solid fa-clock-rotate-left"></i> ประวัติการส่งคำขอล่าสุด</h3>
        <div id="historyList"></div>
    </div>

</div>

<script>
    // 🚨 1. ใส่ LIFF ID หน้า Dashboard นักเรียน 🚨
    const LIFF_ID = "2011162626-3ElMqLDI";
    // 🚨 2. ใส่ API URL 🚨
    const API_URL = "https://script.google.com/macros/s/AKfycbzPyR4k6rVOrBFIB4QiBYBO9ntaY0mWpo7mck4RTzeV-rWpWLa-mRviLfuyG8lH62s/exec";

    let currentProfile = { id: "", name: "", group: "" };
    let globalAttendance = []; 
    let globalAssignments = []; 
    let globalExams = []; 
    let globalTeachers = []; 

    // 11 รายการเป้าหมายหลัก
    const MASTER_GOALS = [
        { type: "exam", name: "Pre-Clinic Part 1", key: "Part 1" },
        { type: "exam", name: "Pre-Clinic Part 2", key: "Part 2" },
        { type: "exam", name: "Pre-Clinic Part 3", key: "Part 3" },
        { type: "exam", name: "สอบถ่ายนอกช่องปาก (OPG)", key: "สอบถ่ายนอกช่องปาก (OPG)" },
        { type: "exam", name: "สอบ Pa (Anterior)", key: "Pa (Anterior)" },
        { type: "exam", name: "สอบ Pa (Posterior)", key: "Pa (Posterior)" },
        { type: "exam", name: "สอบ Bite Wing", key: "Bite Wing" },
        { type: "exam", name: "สอบเรียงภาพ FM", key: "สอบเรียงภาพ FM" },
        { type: "exam", name: "สอบประเมินภาพ", key: "สอบประเมินภาพ" },
        { type: "assign", name: "ใบงานในช่องปาก", key: "ในช่องปาก" },
        { type: "assign", name: "ใบงานนอกช่องปาก", key: "นอกช่องปาก" }
    ];

    const EXAM_LIST_FULL = ["สอบถ่ายนอกช่องปาก (OPG)", "Pa (Anterior)", "Pa (Posterior)", "Bite Wing", "สอบเรียงภาพ FM", "สอบประเมินภาพ"];
    const ASSIGN_LIST_FULL = ["ในช่องปาก (ใบงานที่ 1)", "ในช่องปาก (ใบงานที่ 2)", "ในช่องปาก (ใบงานที่ 3)", "นอกช่องปาก (ใบงานที่ 1)", "นอกช่องปาก (ใบงานที่ 2)", "นอกช่องปาก (ใบงานที่ 3)"];

    window.onload = () => { 
        // 🌟 1. ดึง Cache เก่าขึ้นมาโชว์ก่อนทันที (Fast Load)
        let cachedData = localStorage.getItem("studentDashboardCache");
        let cachedImage = localStorage.getItem("studentProfileImage");
        
        if (cachedData) {
            try {
                let d = JSON.parse(cachedData);
                if (cachedImage) document.getElementById("userImg").src = cachedImage;
                renderDashboardData(d); // แสดงข้อมูลเก่าทันที
                document.getElementById("loadingDiv").style.display = "none";
                document.getElementById("mainDiv").style.display = "block";
            } catch(e) { }
        }

        // 🌟 2. เริ่มเชื่อมต่อ LIFF และดึงข้อมูลใหม่แบบเบื้องหลัง (Background Fetch)
        liff.init({ liffId: LIFF_ID }).then(() => { 
            if(liff.isLoggedIn()) {
                liff.getProfile().then(p => { 
                    let profileImg = p.pictureUrl || "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
                    document.getElementById("userImg").src = profileImg; 
                    localStorage.setItem("studentProfileImage", profileImg);
                    
                    fetchDashboard(p.userId); 
                });
            } else { liff.login(); }
        }); 
    };

    function fetchDashboard(uid) {
        fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getStudentDashboard", studentUid: uid }) })
        .then(res => res.json()).then(data => {
            if(data.status === "success") {
                // 🌟 บันทึกข้อมูลใหม่ลง Cache
                localStorage.setItem("studentDashboardCache", JSON.stringify(data.data));
                
                // 🌟 อัปเดตหน้าจอด้วยข้อมูลล่าสุด
                renderDashboardData(data.data);
                
                document.getElementById("loadingDiv").style.display = "none";
                document.getElementById("mainDiv").style.display = "block";
            } else {
                if(!localStorage.getItem("studentDashboardCache")) {
                    Swal.fire('ยังไม่ลงทะเบียน', 'ระบบยังไม่พบข้อมูลของคุณ กรุณาลงทะเบียนก่อนครับ', 'warning');
                }
            }
        }).catch(() => {
            // ถ้าระบบออฟไลน์ และมี Cache อยู่แล้ว หน้าจอจะไม่หมุนค้าง
        });
    }

    // 🌟 แยกฟังก์ชันการแสดงผลหน้าจอออกมา เพื่อให้ใช้งานร่วมกับระบบ Cache ได้
    function renderDashboardData(d) {
        currentProfile.id = d.studentId; 
        currentProfile.name = d.studentName; 
        currentProfile.group = d.studentGroup;

        // 🌟 ซิงค์ความจำพื้นฐานให้ตรงกัน ป้องกันชื่อเก่าค้างเวลาข้ามหน้าเว็บ
        localStorage.setItem("studentId", d.studentId);
        localStorage.setItem("studentName", d.studentName);
        
        globalAttendance = d.attendanceLog || [];
        globalAssignments = d.assignments || [];
        globalExams = d.exams || [];
        globalTeachers = d.teachersList || []; 

        let displayGroup = (!isNaN(d.studentGroup) && d.studentGroup !== "") ? "กลุ่ม " + d.studentGroup : d.studentGroup;
        document.getElementById("userName").innerText = d.studentName;
        document.getElementById("userGroup").innerText = `รหัส: ${d.studentId} | ${displayGroup}`;
        
        document.getElementById("sHours").innerText = d.totalHours;
        document.getElementById("sLate").innerText = d.lateCount; // ค่ามาสายถูกนับจาก Code.gs (08:15) มาแล้ว
        document.getElementById("sCheckin").innerText = d.totalCheckIn;
        
        let assignCount = globalAssignments.filter(a => a.status === "Completed").length;
        let examCount = globalExams.filter(e => e.status === "Completed").length;
        document.getElementById("sAssign").innerText = assignCount;
        document.getElementById("sExam").innerText = examCount;

        let passedCount = 0;
        let goalHtml = `<div class="goal-section-title">🌟 สิ่งที่ทำสำเร็จแล้ว (ส่งงาน / สอบ)</div><div class="goal-list">`;
        
        MASTER_GOALS.forEach(goal => {
            let isPassed = false;
            if(goal.type === "exam") isPassed = globalExams.some(e => e.name.includes(goal.key) && e.status === "Completed");
            else if (goal.type === "assign") isPassed = globalAssignments.some(a => a.name.includes(goal.key) && a.status === "Completed");

            if(isPassed) {
                passedCount++;
                let icon = goal.type === "exam" ? "fa-graduation-cap" : "fa-file-signature";
                goalHtml += `
                    <div class="goal-item done">
                        <div class="goal-item-title"><i class="fa-solid ${icon}"></i> ${goal.name}</div>
                        <div class="goal-item-status"><i class="fa-solid fa-check"></i> สำเร็จ</div>
                    </div>`;
            }
        });
        goalHtml += `</div>`;

        if(passedCount === 0) goalHtml = `<div style="text-align:center; padding: 20px; color:#94a3b8; font-size:13px; background:#f8fafc; border-radius:12px; border:1px dashed #cbd5e1;">ยังไม่มีรายการที่ทำสำเร็จเลยครับ เริ่มลุยเก็บเป้าหมายกันเถอะ! 🚀</div>`;
        document.getElementById("goalListArea").innerHTML = goalHtml;
        
        let pct = Math.round((passedCount / MASTER_GOALS.length) * 100);
        setTimeout(() => { document.getElementById("progressBar").style.width = pct + "%"; }, 50); 
        document.getElementById("progressText").innerText = `${pct}% (${passedCount}/${MASTER_GOALS.length})`;

        let hList = document.getElementById("historyList");
        if(d.recentHistory.length === 0) hList.innerHTML = `<div style="text-align:center; padding: 15px; color:#94a3b8; font-size:13px;">ยังไม่มีประวัติการส่งข้อมูลครับ</div>`;
        else {
            let hHtml = "";
            d.recentHistory.forEach(h => {
                let stText = "เสร็จแล้ว", stClass = "status-Submitted", stIcon = "fa-check", reasonHtml = "";
                
                if(h.realStatus && h.realStatus.includes("Rejected")) { 
                    stText = "ตีกลับ"; stClass = "status-Rejected"; stIcon = "fa-xmark";
                    let reason = h.realStatus.replace("Rejected:", "").trim();
                    reasonHtml = `
                        <div class="h-reason-box">
                            <div class="h-reason-text"><i class="fa-solid fa-circle-exclamation"></i> <span><b>เหตุผลที่แก้ไข:</b> ${reason}</span></div>
                            <button class="btn-resubmit" onclick="resubmitTask('${h.logId}', '${h.category}', '${h.subCategory}')">
                                <i class="fa-solid fa-pen-to-square"></i> แก้ไขข้อมูลและส่งใหม่
                            </button>
                        </div>`;
                }
                else if(h.status === "Pending") {
                    stText = "รอตรวจ"; stClass = "status-Pending"; stIcon = "fa-clock";
                }
                
                hHtml += `
                    <div class="history-item" style="flex-direction: column;">
                        <div style="display:flex; justify-content: space-between; width: 100%; align-items: flex-start;">
                            <div>
                                <div class="h-title"><i class="fa-solid fa-file-lines" style="color:#94a3b8;"></i> ${h.title}</div>
                                <div class="h-date"><i class="fa-regular fa-clock"></i> ${h.date}</div>
                            </div>
                            <span class="status-badge ${stClass}"><i class="fa-solid ${stIcon}"></i> ${stText}</span>
                        </div>
                        ${reasonHtml}
                    </div>`;
            });
            hList.innerHTML = hHtml;
        }
    }

    function resubmitTask(logId, cat, sub) {
        let optionsHtml = '<option value="" disabled selected>-- เลือกคุณครูท่านใหม่ --</option>';
        globalTeachers.forEach(t => optionsHtml += `<option value="${t.id}">${t.name}</option>`);

        Swal.fire({
            title: 'แก้ไขและส่งคำขอใหม่',
            html: `
                <div style="font-size: 13px; color: #475569; margin-bottom: 15px; text-align:left; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0;">
                    <b>เรื่องที่ส่ง:</b> ${cat} - ${sub}
                </div>
                <div style="text-align: left; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #1e293b;">ส่งถึงคุณครูท่านใหม่:</div>
                <select id="swal-new-teacher" class="swal2-select" style="width: 100%; max-width: 100%; font-size: 14px; font-family: 'Prompt'; margin: 0 0 15px 0; display: block; border-radius: 8px; padding: 10px;">
                    ${optionsHtml}
                </select>
            `,
            showCancelButton: true, confirmButtonText: 'ยืนยันการส่งใหม่', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#3b82f6', cancelButtonColor: '#94a3b8',
            customClass: { popup: 'swal-wide', title: 'swal-title-custom' },
            preConfirm: () => {
                let tid = document.getElementById('swal-new-teacher').value;
                if (!tid) { Swal.showValidationMessage('กรุณาเลือกคุณครูด้วยครับ'); return false; }
                return tid;
            }
        }).then((result) => {
            if(result.isConfirmed) {
                Swal.fire({title: 'กำลังส่งคำขอใหม่...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
                fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'resubmitRequest', logId: logId, newTeacherId: result.value }) })
                .then(r => r.json()).then(data => {
                    if(data.status === 'success') {
                        // 🌟 เคลียร์ Cache เพื่อให้ดึงข้อมูลใหม่ทันที
                        localStorage.removeItem("studentDashboardCache");
                        Swal.fire('สำเร็จ', data.message, 'success').then(() => window.location.reload());
                    } else { Swal.fire('ผิดพลาด', data.message, 'error'); }
                });
            }
        });
    }

    // 🌟 ฟังก์ชันโชว์รายละเอียดการมาสาย (ทำงานเมื่อกดที่กล่องมาสาย)
    function showLateDetails() {
        // คัดกรองเฉพาะ log ที่มีคำว่าสายอยู่ในหมายเหตุ
        let lateLogs = globalAttendance.filter(r => r.remark && r.remark.includes("สาย"));
        
        if(lateLogs.length === 0) {
            return Swal.fire('ข้อมูล', 'ยอดเยี่ยมมากครับ! คุณไม่เคยมาสายเลย 🎉', 'success');
        }
        
        let html = `<div style="max-height: 50vh; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 12px; margin-top: 10px; text-align: left;">
            <table class="att-table">
            <thead><tr><th>วันที่</th><th>เวลาเข้า</th><th>หมายเหตุ</th></tr></thead><tbody>`;
            
        lateLogs.forEach(r => {
            let rem = r.remark;
            rem = `<span style="color:#ef4444; font-weight:600; background:#fef2f2; padding:2px 6px; border-radius:6px;">${rem}</span>`;
            html += `<tr><td style="white-space: nowrap;">${r.date}</td><td class="att-time out" style="color:#ef4444;">${r.in}</td><td style="font-size:11px;">${rem}</td></tr>`;
        });
        
        html += `</tbody></table></div>`;
        
        Swal.fire({ 
            title: '<i class="fa-solid fa-person-running" style="color:#ef4444;"></i> ประวัติการมาสาย', 
            html: html, 
            customClass: { popup: 'swal-wide', title: 'swal-title-custom' }, 
            confirmButtonText: 'ปิดหน้าต่าง', 
            confirmButtonColor: '#64748b' 
        });
    }

    function showAttendanceDetails() {
        if(globalAttendance.length === 0) return Swal.fire('ไม่มีข้อมูล', 'ยังไม่มีประวัติลงเวลาเลยครับ', 'info');
        let html = `<div style="max-height: 50vh; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 12px; margin-top: 10px;">
            <table class="att-table">
            <thead><tr><th>วันที่</th><th>เข้า</th><th>ออก</th><th>ชม.</th><th>หมายเหตุ</th></tr></thead><tbody>`;
        globalAttendance.forEach(r => {
            let rem = r.remark;
            if(rem.includes("สาย") || rem.includes("ขาด") || rem.includes("ขัดข้อง")) rem = `<span style="color:#ef4444; font-weight:600; background:#fef2f2; padding:2px 6px; border-radius:6px;">${rem}</span>`;
            else if(rem.includes("ลา")) rem = `<span style="color:#d97706; font-weight:600; background:#fffbeb; padding:2px 6px; border-radius:6px;">${rem}</span>`;
            html += `<tr><td style="white-space: nowrap;">${r.date}</td><td class="att-time in">${r.in}</td><td class="att-time out">${r.out}</td><td><span class="att-hours">${r.hours}</span></td><td style="font-size:11px;">${rem||'-'}</td></tr>`;
        });
        html += `</tbody></table></div>`;
        Swal.fire({ title: '<i class="fa-solid fa-calendar-check" style="color:#10b981;"></i> ประวัติมาทำงาน', html: html, customClass: { popup: 'swal-wide', title: 'swal-title-custom' }, confirmButtonText: 'ปิดหน้าต่าง', confirmButtonColor: '#64748b' });
    }

    function showAssignmentDetails() {
        let html = `<div class="detail-list">`;
        ASSIGN_LIST_FULL.forEach(taskName => {
            let isDone = globalAssignments.some(a => a.name === taskName && a.status === "Completed");
            if(isDone) {
                html += `<div class="detail-card"><div class="dc-header"><div class="dc-title"><i class="fa-solid fa-file-signature" style="color:#3b82f6;"></i> ${taskName}</div><div class="dc-status done"><i class="fa-solid fa-check"></i> เสร็จแล้ว</div></div></div>`;
            } else {
                html += `<div class="detail-card"><div class="dc-header"><div class="dc-title" style="color:#64748b;"><i class="fa-regular fa-file" style="color:#94a3b8;"></i> ${taskName}</div><div class="dc-status todo">ยังไม่ได้ส่ง</div></div></div>`;
            }
        });
        html += `</div>`;
        Swal.fire({ title: '<i class="fa-solid fa-file-arrow-up" style="color:#3b82f6;"></i> สถานะการส่งใบงาน', html: html, customClass: { popup: 'swal-wide', title: 'swal-title-custom' }, confirmButtonText: 'ปิดหน้าต่าง', confirmButtonColor: '#64748b' });
    }

    function showExamDetails() {
        let html = `<div class="detail-list">`;
        EXAM_LIST_FULL.forEach(examName => {
            let isDone = globalExams.some(e => e.name.includes(examName) && e.status === "Completed");
            if(isDone) {
                html += `<div class="detail-card"><div class="dc-header"><div class="dc-title"><i class="fa-solid fa-graduation-cap" style="color:#ec4899;"></i> ${examName}</div><div class="dc-status done"><i class="fa-solid fa-check"></i> เสร็จแล้ว</div></div></div>`;
            } else {
                html += `<div class="detail-card"><div class="dc-header"><div class="dc-title" style="color:#64748b;"><i class="fa-solid fa-minus" style="color:#94a3b8;"></i> ${examName}</div><div class="dc-status todo">ยังไม่ได้สอบ</div></div></div>`;
            }
        });
        html += `</div>`;
        Swal.fire({ title: '<i class="fa-solid fa-stethoscope" style="color:#ec4899;"></i> สถานะการสอบปฏิบัติ', html: html, customClass: { popup: 'swal-wide', title: 'swal-title-custom' }, confirmButtonText: 'ปิดหน้าต่าง', confirmButtonColor: '#64748b' });
    }

    function openEditModal() {
        Swal.fire({
            title: 'แก้ไขข้อมูลส่วนตัว',
            html: `
                <div style="text-align: left; font-size: 13px; margin-top: 10px; margin-bottom: 5px; font-weight: 600; color: #475569;">รหัสประจำตัว</div>
                <input id="swal-id" class="swal2-input" value="${currentProfile.id}" type="number" style="margin-top:0; max-width:100%; border-radius:8px;">
                <div style="text-align: left; font-size: 13px; margin-top: 15px; margin-bottom: 5px; font-weight: 600; color: #475569;">ชื่อ-นามสกุล</div>
                <input id="swal-name" class="swal2-input" value="${currentProfile.name}" style="margin-top:0; max-width:100%; border-radius:8px;">
                <div style="text-align: left; font-size: 13px; margin-top: 15px; margin-bottom: 5px; font-weight: 600; color: #475569;">กลุ่มเรียน (ใส่เฉพาะตัวเลข)</div>
                <input id="swal-group" class="swal2-input" value="${currentProfile.group}" type="number" style="margin-top:0; max-width:100%; border-radius:8px;">
            `,
            showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#4f46e5', cancelButtonColor: '#94a3b8',
            customClass: { popup: 'swal-wide', title: 'swal-title-custom' },
            preConfirm: () => ({ id: document.getElementById('swal-id').value.trim(), name: document.getElementById('swal-name').value.trim(), group: document.getElementById('swal-group').value.trim() })
        }).then((result) => {
            if(result.isConfirmed) {
                let p = result.value;
                if(!p.id || !p.name || !p.group) return Swal.fire('ผิดพลาด', 'กรุณากรอกข้อมูลให้ครบถ้วน', 'warning');
                Swal.fire({title:'กำลังบันทึก...', allowOutsideClick: false, didOpen:()=>Swal.showLoading()});
                liff.getProfile().then(profile => {
                    fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'updateProfile', role: 'student', userId: profile.userId, inputId: p.id, fullName: p.name, groupName: p.group }) })
                    .then(r=>r.json()).then(data=>{ 
                        if(data.status==='success') {
                            localStorage.removeItem("studentDashboardCache"); // เคลียร์ Cache ให้รีโหลดชื่อใหม่
                            Swal.fire('สำเร็จ', data.message, 'success').then(()=>window.location.reload()); 
                        }
                    });
                });
            }
        });
    }
</script>
</body>
</html>
