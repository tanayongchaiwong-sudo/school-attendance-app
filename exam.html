    <style>
        :root { --primary: #ec4899; --primary-hover: #db2777; --bg: #fdf2f8; --text: #1f2937; --border: #fbcfe8; }
        body { font-family: 'Prompt', sans-serif; background-color: var(--bg); margin: 0; padding: 15px; color: var(--text); }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.1); }
        .header { text-align: center; margin-bottom: 25px; border-bottom: 2px dashed var(--border); padding-bottom: 20px; }
        .header i { font-size: 40px; color: var(--primary); margin-bottom: 10px; }
        .header h2 { margin: 0; font-size: 22px; font-weight: 600; color: #9d174d; }
        .header p { margin: 8px 0 0; font-size: 15px; color: #db2777; font-weight: 500; background: #fce7f3; display: inline-block; padding: 6px 16px; border-radius: 20px; }
        
        .question-card { background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .question-title { font-size: 16px; font-weight: 600; margin: 0 0 15px 0; color: #be185d; line-height: 1.5; }
        .question-image { text-align: center; margin-bottom: 15px; }
        .question-image img { max-width: 100%; max-height: 250px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border: 1px solid var(--border); }
        
        .option-label { display: flex; align-items: flex-start; background: #fdf2f8; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border); cursor: pointer; transition: 0.2s; font-size: 15px; color: #4b5563; }
        .option-label:hover { background: #fce7f3; border-color: #f9a8d4; }
        .option-label input[type="radio"] { margin-right: 12px; margin-top: 3px; accent-color: var(--primary); transform: scale(1.2); }
        .option-text { flex: 1; }
        .option-text img { max-width: 150px; border-radius: 6px; margin-top: 5px; display: block; border: 1px solid #e5e7eb; }

        .btn-submit { width: 100%; padding: 15px; font-family: 'Prompt', sans-serif; font-weight: 600; font-size: 16px; background: var(--primary); color: white; border: none; border-radius: 12px; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 6px rgba(236, 72, 153, 0.3); transition: 0.3s; }
        .btn-submit:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .hidden { display: none !important; }
    </style>
</head>

            { q: "8. ก่อนที่จะให้ผู้ป่วยกัดแท่นกัดควรทำสิ่งใดก่อน?", image: "", options: ["ก. ให้ผู้ป่วยแปรงฟัน", "ข. ทำความสะอาดแท่นกัด", "ค. ใช้แรปพลาสติก (Wrap) คลุมแท่นกัดก่อน", "ง. ใช้ถุงพลาสติกคลุมแท่นกัดก่อน"], answer: 3 },
            { q: "9. หลังถ่ายเอกซเรย์เสร็จควรทำอะไรก่อนให้กับผู้ป่วย?", image: "", options: ["ก. ให้ผู้ป่วยยืนนิ่งๆ", "ข. ให้ผู้ป่วยบ้วนปากฆ่าเชื้อ", "ค. ถอดเสื้อกันรังสี", "ง. ถูกทุกข้อ"], answer: 2 },
            { q: "10. หลังถ่ายเอกซเรย์เสร็จควรทำอย่างไร?", image: "", options: ["ก. นำถุงกัดพร้อมแท่นกัดทิ้งและเช็ดฆ่าเชื้อ", "ข. นำถุงกัดทิ้งและเช็ดฆ่าเชื้อ", "ค. นำถุงกัดพร้อมแท่นกัดทิ้งและเช็ดฆ่าเชื้อทิ้งไว้ 5 นาที", "ง. นำถุงกัดทิ้งและเช็ดฆ่าเชื้อทิ้งไว้ 5 นาที"], answer: 1 }
        ]
    };

    let currentPartKey = "";
    let currentQuestions = [];

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        let partParam = urlParams.get('part') || "Part 1"; 

        currentPartKey = Object.keys(quizData).find(key => key.includes(partParam));
        
        if (!currentPartKey || !quizData[currentPartKey] || quizData[currentPartKey].length === 0) {
            Swal.fire('ข้อผิดพลาด', 'ไม่พบชุดข้อสอบ หรือลิงก์ไม่ถูกต้อง\nกรุณาเข้าทำข้อสอบผ่านศูนย์บริการนักเรียนครับ', 'error');
            return;
        }

        currentQuestions = quizData[currentPartKey];
        document.getElementById("examPartTitle").innerText = currentPartKey.split(":")[0];

        liff.init({ liffId: LIFF_ID }).then(() => {
            if (liff.isLoggedIn()) {
                liff.getProfile().then(p => { fetchStudentData(p.userId); });
            } else { liff.login(); }
        });
    };

    function fetchStudentData(uid) {
        fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getStudentDashboard", studentUid: uid }) })
        .then(res => res.json()).then(data => {
            if(data.status === "success") {
                document.getElementById("studentId").value = data.data.studentId;
                document.getElementById("studentName").value = data.data.studentName;
                renderQuestions();
            } else {
                Swal.fire('ข้อผิดพลาด', 'ไม่พบบัญชีนักเรียนของคุณ กรุณาลงทะเบียนเข้าระบบก่อนครับ', 'error');
            }
        });
    }

    function renderQuestions() {
        let html = "";
        currentQuestions.forEach((q, idx) => {
            html += `<div class="question-card"><h3 class="question-title">${q.q}</h3>`;
            if (q.image && q.image.trim() !== "") {
                html += `<div class="question-image"><img src="${q.image}" alt="ภาพประกอบข้อสอบ"></div>`;
            }
            q.options.forEach((opt, oIdx) => {
                html += `<label class="option-label"><input type="radio" name="q${idx}" value="${oIdx}"><div class="option-text">${opt}</div></label>`;
            });
            html += `</div>`;
        });
        document.getElementById("questionsArea").innerHTML = html;
        document.getElementById("loadingDiv").classList.add("hidden");
        document.getElementById("quizContainer").classList.remove("hidden");
    }

    function submitExam() {
        let correctCount = 0;
        let isComplete = true;
        let totalQuestions = currentQuestions.length;

        currentQuestions.forEach((q, idx) => {
            let selected = document.querySelector(`input[name="q${idx}"]:checked`);
            if (!selected) { isComplete = false; } 
            else if (parseInt(selected.value) === q.answer) { correctCount++; }
        });

        if (!isComplete) return Swal.fire('แจ้งเตือน', 'กรุณาตอบคำถามให้ครบถ้วนทุกข้อก่อนส่งครับ', 'warning');

        let finalScore = (correctCount / totalQuestions) * 10;
        finalScore = Math.round(finalScore * 10) / 10; 

        Swal.fire({
            title: 'ยืนยันส่งข้อสอบ?',
            text: "หากส่งคำตอบแล้วจะไม่สามารถกลับมาแก้ไขได้อีก",
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#ec4899',
            cancelButtonColor: '#9ca3af',
            confirmButtonText: 'ยืนยันการส่ง',
            cancelButtonText: 'ยกเลิก'
        }).then((result) => {
            if (result.isConfirmed) {
                Swal.fire({ title: 'กำลังตรวจคำตอบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

                let payload = {
                    action: "submitAutoExamScore",
                    studentId: document.getElementById("studentId").value,
                    studentName: document.getElementById("studentName").value,
                    part: currentPartKey.split(":")[0].trim(), 
                    score: finalScore
                };

                fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
                .then(res => res.json()).then(data => {
                    if(data.status === "success") {
                        Swal.fire({
                            icon: 'success',
                            title: 'สอบเสร็จสิ้น! 🎉',
                            html: `ทำถูก: <b>${correctCount}</b> / ${totalQuestions} ข้อ<br><br>คิดเป็นคะแนน: <b style="color:#ec4899; font-size:22px;">${finalScore}</b> / 10<br><br><span style="font-size:13px; color:#6b7280;">(ระบบได้บันทึกคะแนนของคุณเรียบร้อยแล้ว)</span>`,
                            confirmButtonColor: '#ec4899',
                            confirmButtonText: 'ปิดหน้าต่าง'
                        }).then(() => { liff.closeWindow(); });
                    } else { Swal.fire('ข้อผิดพลาด', data.message, 'error'); }
                });
            }
        });
    }
</script>
