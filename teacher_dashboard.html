<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>สรุปข้อมูลนักเรียน (Teacher Dashboard)</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        :root { --primary: #f97316; --primary-hover: #ea580c; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: 'Prompt', sans-serif; background: var(--bg); margin: 0; padding: 15px; color: var(--text); }
        .container { max-width: 500px; margin: 0 auto; padding-bottom: 30px;}
        
        .profile-card { background: linear-gradient(135deg, #f97316, #ea580c); color: white; padding: 25px 20px; border-radius: 20px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 25px rgba(234, 88, 12, 0.25); margin-bottom: 20px; position: relative; }
        .profile-card img { width: 65px; height: 65px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.8); object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .profile-info { flex: 1; }
        .profile-info h2 { margin: 0 0 4px 0; font-size: 18px; font-weight: 600; line-height: 1.2;}
        .profile-info p { margin: 0; font-size: 13px; opacity: 0.9;}
        .edit-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.2); color: white; border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .edit-btn:hover { background: rgba(255,255,255,0.3); transform: rotate(15deg); }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-box { background: white; padding: 15px 10px; border-radius: 16px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.04); border: 1px solid #f1f5f9; display: flex; flex-direction: column; align-items: center;}
        
        .clickable-box { cursor: pointer; border: 2px solid transparent; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .clickable-box:hover { transform: translateY(-4px); border-color: #f97316; box-shadow: 0 8px 25px rgba(249, 115, 22, 0.15); background-color: #fff7ed; }

        .icon-circle { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; background: #ffedd5; color: #ea580c; font-size: 20px;}
        .stat-num { font-size: 24px; font-weight: 600; color: #1e293b; line-height: 1; margin-bottom: 4px; }
        .stat-label { font-size: 12px; color: #64748b; font-weight: 600; }
        .action-hint { font-size: 10px; color: #ea580c; margin-top: 5px; background: #ffedd5; padding: 2px 6px; border-radius: 10px; display: inline-block; font-weight: 600;}
        
        .tabs { display: flex; background: white; border-radius: 12px; padding: 5px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.02);}
        .tab-btn { flex: 1; padding: 10px; text-align: center; font-family: 'Prompt'; font-size: 13px; font-weight: 600; color: #64748b; background: none; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s;}
        .tab-btn.active { background: #ffedd5; color: var(--primary); }
        
        .list-card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); border: 1px solid #f1f5f9;}
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px dashed #e2e8f0; padding-bottom: 10px; }
        .list-header h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; color: #ea580c; font-weight: 600;}
        
        .group-filter { padding: 6px 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: 'Prompt'; font-size: 12px; outline: none; background: #f8fafc; color: #334155; font-weight: 500;}
        .group-filter:focus { border-color: #f97316; }

        .student-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 10px; border-bottom: 1px dashed #e2e8f0; cursor: pointer; transition: 0.2s; border-radius: 8px;}
        .student-item:hover { background: #f8fafc; transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.02); border-color: transparent;}
        .student-item:last-child { border-bottom: none; }
        
        .s-name { font-size: 14px; font-weight: 600; color: #1e293b; display: flex; align-items: center; gap: 6px;}
        .s-group-badge { font-size: 10px; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; color: #64748b; font-weight: 500;}
        .s-id { font-size: 11px; color: #94a3b8; margin-top: 2px;}
        .s-stats { text-align: right; display: flex; flex-direction: column; gap: 4px; }
        
        .badge { padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 4px;}
        .badge-hours { background: #ffedd5; color: #c2410c; }
        .badge-exams { background: #dcfce3; color: #15803d; }

        .history-item { padding: 15px 0; border-bottom: 1px dashed #e2e8f0; }
        .history-item:last-child { border: none; padding-bottom: 0; }
        .h-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px;}
        .h-title { font-size: 14px; font-weight: 600; color: #1e293b; }
        .h-score { font-size: 16px; font-weight: 600; color: white; background: #ea580c; padding: 2px 10px; border-radius: 8px;}
        .h-detail { font-size: 12px; color: #64748b; margin-bottom: 10px;}
        .action-btns { display: flex; gap: 8px; justify-content: flex-end;}
        .btn-sm { font-family: 'Prompt'; font-size: 11px; padding: 6px 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;}
        .btn-edit { background: #e0e7ff; color: #4338ca; }
        .btn-revoke { background: #fee2e2; color: #b91c1c; }

        .rubric-box { background: #fff7ed; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #ffedd5; text-align: left; }
        .rubric-box h4 { margin: 0 0 10px 0; color: #c2410c; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .rubric-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px dashed #fed7aa; padding-bottom: 8px; }
        .rubric-row:last-child { border: none; margin-bottom: 0; padding-bottom: 0; }
        .rubric-row label { margin: 0; font-weight: 500; flex: 1; font-size: 13px; text-align: left; color: #4b5563;}
        .rubric-row input[type="number"] { width: 70px; text-align: center; padding: 6px; border: 1px solid #fed7aa; border-radius: 8px; font-family: 'Prompt'; outline: none; font-size:14px; background: white; font-weight: 600; color: #ea580c;}
        .rubric-row input[type="number"]:focus { border-color: #f97316; box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.2); }
        .swal-wide { width: 95% !important; max-width: 500px !important; border-radius: 16px; }
        .swal-title-custom { font-family: 'Prompt'; font-size: 18px; font-weight: 600; color: #1e293b; margin-bottom: 10px;}
        
        .pending-list-popup { max-height: 50vh; overflow-y: auto; text-align: left; padding-right: 5px; display: flex; flex-direction: column; gap: 8px;}
        .pending-item-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 15px; border-left: 4px solid #f97316;}
        
        .detail-list { display: flex; flex-direction: column; gap: 8px; max-height: 55vh; overflow-y: auto; padding-right: 5px; text-align: left;}
        .detail-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;}
        .dc-header { display: flex; justify-content: space-between; align-items: flex-start;}
        .dc-title { font-size: 13px; font-weight: 500; color: #334155; display: flex; align-items: flex-start; gap: 6px;}
        .dc-title i { margin-top: 3px; }
        .dc-status { font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 10px; white-space: nowrap;}
        .dc-status.done { background: #d1fae5; color: #047857; } 
        .dc-status.todo { background: #fef08a; color: #b45309; }

        .hidden { display: none !important; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px;}
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>

<div class="container" id="loadingDiv" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh;">
    <i class="fa-solid fa-spinner fa-spin" style="font-size: 45px; color: #f97316; margin-bottom: 15px;"></i>
    <div style="font-size: 14px; color: #64748b; font-weight: 500;">กำลังโหลดข้อมูลคุณครู...</div>
</div>

<div class="container hidden" id="mainDiv">
    
    <!-- 🏠 ส่วนแสดง Dashboard ของคุณครู -->
    <div id="teacherDashboard">
        <div class="profile-card">
            <button class="edit-btn" onclick="openEditModal()"><i class="fa-solid fa-pen"></i></button>
            <img id="userImg" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Teacher">
            <div class="profile-info">
                <h2 id="userName">กำลังโหลด...</h2>
                <p>คุณครูผู้ประเมิน</p>
            </div>
        </div>

        <div class="stat-grid">
            <div class="stat-box clickable-box" onclick="showPendingTasks()">
                <div class="icon-circle"><i class="fa-solid fa-clipboard-question"></i></div>
                <div class="stat-num" id="tPending">0</div>
                <div class="stat-label">งานรอประเมิน</div>
                <div class="action-hint"><i class="fa-solid fa-hand-pointer"></i> กดตรวจงาน</div>
            </div>
            <div class="stat-box">
                <div class="icon-circle" style="background: #e0e7ff; color: #4f46e5;"><i class="fa-solid fa-users"></i></div>
                <div class="stat-num" id="tStudents">0</div>
                <div class="stat-label">นักเรียนที่แสดงอยู่</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="tabStud" onclick="switchTab('students')"><i class="fa-solid fa-users-viewfinder"></i> ภาพรวมนักเรียน</button>
            <button class="tab-btn" id="tabHist" onclick="switchTab('history')"><i class="fa-solid fa-clock-rotate-left"></i> ประวัติประเมิน</button>
        </div>

        <div class="list-card" id="viewStudents">
            <div class="list-header">
                <h3><i class="fa-solid fa-users"></i> ข้อมูลนักเรียน</h3>
                <select id="groupFilter" class="group-filter" onchange="renderStudentList()">
                    <option value="All">ดูทุกกลุ่ม</option>
                </select>
            </div>
            <div id="studentListArea"></div>
        </div>

        <div class="list-card hidden" id="viewHistory">
            <div class="list-header">
                <h3><i class="fa-solid fa-clock-rotate-left"></i> ประวัติให้คะแนนล่าสุด</h3>
            </div>
            <div id="historyListArea"></div>
        </div>
    </div>

    <!-- 📝 ส่วนแสดงหน้าฟอร์มให้คะแนน (Evaluation Form) -->
    <div id="step2Form" class="hidden">
        <button class="btn-back" style="background:none; border:none; color:#6b7280; font-size:15px; font-family:'Prompt'; cursor:pointer; margin-bottom:15px; display:flex; align-items:center; gap:5px;" onclick="goBackToDashboard()"><i class="fa-solid fa-arrow-left"></i> กลับไปหน้าแรก</button>
        
        <div id="studentInfoArea"></div>
        <div id="dynamicRubricArea"></div>

        <div class="form-group">
            <label style="font-size: 13px; font-weight: 600; color: #4b5563; margin-bottom: 8px; display: block;"><i class="fa-solid fa-comment-dots"></i> หมายเหตุ / ข้อเสนอแนะ (ถ้ามี)</label>
            <input type="text" id="remark1" placeholder="พิมพ์คำติชมเพื่อการพัฒนา..." style="width: 100%; padding: 12px; font-family: 'Prompt'; font-size: 14px; border: 2px solid #e5e7eb; border-radius: 10px; background: #f9fafb; box-sizing: border-box; outline: none;">
        </div>

        <!-- 🌟 ปุ่ม 3 ปุ่ม: บันทึก | ส่งต่อ(สีฟ้า) | ปฏิเสธ(สีแดง) -->
        <div style="display: flex; gap: 8px; margin-top: 25px;">
            <button style="flex: 1.2; padding: 12px; font-family: 'Prompt'; font-weight: 600; font-size: 14px; background: #f97316; color: white; border: none; border-radius: 10px; cursor: pointer;" onclick="submitPendingScore()">
                <i class="fa-solid fa-floppy-disk"></i> บันทึก
            </button>
            <button style="flex: 1; padding: 12px; font-family: 'Prompt'; font-weight: 600; font-size: 14px; background: #3b82f6; color: white; border: none; border-radius: 10px; cursor: pointer;" onclick="reassignRequest()">
                <i class="fa-solid fa-share"></i> ส่งต่อ
            </button>
            <button style="flex: 0.8; padding: 12px; font-family: 'Prompt'; font-weight: 600; font-size: 14px; background: #ef4444; color: white; border: none; border-radius: 10px; cursor: pointer;" onclick="rejectRequest()">
                <i class="fa-solid fa-xmark"></i> ปฏิเสธ
            </button>
        </div>
    </div>

</div>

<script>
    const LIFF_ID = "2011162626-V8r8boat"; 
    const API_URL = "https://script.google.com/macros/s/AKfycbzPyR4k6rVOrBFIB4QiBYBO9ntaY0mWpo7mck4RTzeV-rWpWLa-mRviLfuyG8lH62s/exec"; 

    let currentTeacherId = "";
    let currentTeacherName = "";
    let pendingRequests = [];
    let currentSelectedIndex = -1; 
    let globalTeachers = []; 
    let gHistoryData = []; 
    let gStudentData = []; 

    window.onload = () => { 
        liff.init({ liffId: LIFF_ID }).then(() => { 
            if(liff.isLoggedIn()) { 
                liff.getProfile().then(p => { 
                    document.getElementById("userImg").src = p.pictureUrl || "https://cdn-icons-png.flaticon.com/512/3135/3135715.png"; 
                    fetchDashboard(p.userId); 
                    fetchTeachersList();
                }); 
            } else { liff.login(); }
        }).catch(() => {
            Swal.fire('ผิดพลาด', 'ไม่สามารถเชื่อมต่อ LINE LIFF ได้', 'error');
        }); 
    };

    function fetchTeachersList() {
        fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getTeachersList" }) })
        .then(res => res.json()).then(data => {
            if(data.status === "success") globalTeachers = data.data;
        });
    }

    function switchTab(tab) {
        if(tab === 'students') {
            document.getElementById("tabStud").classList.add("active"); document.getElementById("tabHist").classList.remove("active");
            document.getElementById("viewStudents").classList.remove("hidden"); document.getElementById("viewHistory").classList.add("hidden");
        } else {
            document.getElementById("tabHist").classList.add("active"); document.getElementById("tabStud").classList.remove("active");
            document.getElementById("viewHistory").classList.remove("hidden"); document.getElementById("viewStudents").classList.add("hidden");
        }
    }

    function fetchDashboard(uid) {
        fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getTeacherDashboard", teacherUid: uid }) })
        .then(res => res.json()).then(data => {
            if(data.status === "success") {
                currentTeacherName = data.teacherName;
                currentTeacherId = data.history.length > 0 ? data.history[0].teacherId : ""; 
                gHistoryData = data.history;
                gStudentData = data.students;
                pendingRequests = data.pendingList || [];

                document.getElementById("userName").innerText = "ครู" + data.teacherName;
                document.getElementById("tPending").innerText = pendingRequests.length;

                let filterDropdown = document.getElementById("groupFilter");
                filterDropdown.innerHTML = '<option value="All">ดูทุกกลุ่ม</option>';
                if(data.groups) {
                    let sortedGroups = data.groups.sort((a, b) => a - b);
                    sortedGroups.forEach(g => {
                        let label = (!isNaN(g) && g !== "") ? "กลุ่ม " + g : g;
                        filterDropdown.innerHTML += `<option value="${g}">${label}</option>`;
                    });
                }

                renderStudentList(); 

                let hHtml = "";
                if (data.history.length === 0) hHtml = "<p style='text-align:center; color:#9ca3af; font-size:13px;'>ยังไม่มีประวัติการให้คะแนนครับ</p>";
                else {
                    data.history.forEach((h, idx) => {
                        hHtml += `<div class="history-item">
                                    <div class="h-header"><div class="h-title">${h.studentName}</div><div class="h-score">${h.rawScore}</div></div>
                                    <div class="h-detail"><b>${h.category}</b> - ${h.subCategory} ${h.detail ? '('+h.detail+')' : ''}<br><i class="fa-regular fa-clock"></i> ${h.date}</div>
                                    <div class="action-btns">
                                        <button class="btn-sm btn-revoke" onclick="revokeScore('${h.logId}')"><i class="fa-solid fa-rotate-left"></i> ยกเลิก/ดึงกลับ</button>
                                        <button class="btn-sm btn-edit" onclick="editScore(${idx})"><i class="fa-solid fa-pen"></i> แก้คะแนนแยกข้อ</button>
                                    </div>
                                 </div>`;
                    });
                }
                document.getElementById("historyListArea").innerHTML = hHtml;
                
                document.getElementById("loadingDiv").style.display = "none";
                document.getElementById("mainDiv").classList.remove("hidden");

                if (pendingRequests.length > 0) {
                    showPendingTasks();
                }

            } else { Swal.fire('ผิดพลาด', data.message, 'error'); }
        }).catch(() => Swal.fire('ผิดพลาด', 'ไม่สามารถติดต่อ Server ได้', 'error'));
    }

    function renderStudentList() {
        let filter = document.getElementById("groupFilter").value;
        let filteredStudents = (filter === "All") ? gStudentData : gStudentData.filter(s => s.group == filter);
        
        document.getElementById("tStudents").innerText = filteredStudents.length;

        let sHtml = "";
        if (filteredStudents.length === 0) {
            sHtml = "<p style='text-align:center; color:#9ca3af; font-size:13px; margin-top:20px;'>ไม่พบนักเรียนในกลุ่มนี้</p>";
        } else {
            filteredStudents.forEach(s => { 
                let displayGroup = (!isNaN(s.group) && s.group !== "") ? "กลุ่ม " + s.group : s.group;
                sHtml += `<div class="student-item" onclick="showStudentDetails('${s.id}')">
                            <div>
                                <div class="s-name">${s.name} <span class="s-group-badge">${displayGroup}</span></div>
                                <div class="s-id">รหัส: ${s.id}</div>
                            </div>
                            <div class="s-stats">
                                <div class="badge badge-hours"><i class="fa-solid fa-hourglass-half"></i> ${s.hours} ชม.</div>
                                <div class="badge badge-exams"><i class="fa-solid fa-graduation-cap"></i> สอบ ${s.exams} เรื่อง</div>
                            </div>
                          </div>`; 
            });
        }
        document.getElementById("studentListArea").innerHTML = sHtml;
    }

    function showStudentDetails(sId) {
        let s = gStudentData.find(x => x.id === sId);
        if(!s) return;

        let html = `<div class="detail-list">`;
        
        html += `<div style="font-weight: 600; color: #b45309; margin-bottom: 8px; margin-top: 5px; text-align: left;"><i class="fa-solid fa-hourglass-half"></i> งานที่ค้างอยู่ / รอตรวจ (${s.pendingTasks.length})</div>`;
        if(s.pendingTasks.length === 0) {
            html += `<div style="text-align:center; padding: 10px; background: #fffbeb; border-radius: 8px; color: #b45309; font-size: 12px;">ไม่มีงานค้างครับ 🎉</div>`;
        } else {
            s.pendingTasks.forEach(t => {
                html += `<div class="detail-card">
                            <div class="dc-header">
                                <div class="dc-title"><i class="fa-solid fa-clock" style="color:#f59e0b;"></i> ${t}</div>
                                <div class="dc-status todo">รอตรวจ</div>
                            </div>
                         </div>`;
            });
        }

        html += `<div style="font-weight: 600; color: #047857; margin-top: 20px; margin-bottom: 8px; text-align: left;"><i class="fa-solid fa-circle-check"></i> งานที่ทำสำเร็จแล้ว (${s.completedTasks.length})</div>`;
        if(s.completedTasks.length === 0) {
            html += `<div style="text-align:center; padding: 10px; background: #ecfdf5; border-radius: 8px; color: #047857; font-size: 12px;">ยังไม่มีงานที่สำเร็จ</div>`;
        } else {
            s.completedTasks.forEach(t => {
                html += `<div class="detail-card">
                            <div class="dc-header">
                                <div class="dc-title"><i class="fa-solid fa-check" style="color:#10b981;"></i> ${t}</div>
                                <div class="dc-status done">สำเร็จ</div>
                            </div>
                         </div>`;
            });
        }
        html += `</div>`;

        Swal.fire({
            title: `ข้อมูลของ ${s.name}`,
            html: html,
            customClass: { popup: 'swal-wide', title: 'swal-title-custom' },
            confirmButtonText: 'ปิดหน้าต่าง',
            confirmButtonColor: '#64748b'
        });
    }

    function showPendingTasks() {
        if(pendingRequests.length === 0) return Swal.fire('ไม่มีงานค้าง', 'พักผ่อนได้เลยครับคุณครู! ไม่มีงานรอประเมินครับ 🎉', 'success');
        
        let html = `<div class="pending-list-popup">`;
        pendingRequests.forEach((t, idx) => {
            html += `<div class="pending-item-card" style="cursor:pointer;" onclick="Swal.close(); openEvaluationForm(${idx})">

            }

            if(result.isConfirmed) {

    function submitPendingScore() {
        if(currentSelectedIndex === -1) return;
        
        let req = pendingRequests[currentSelectedIndex];
        let subScoresList = []; 
        let isInvalid = false;
        let invalidMsg = "";
        
        let inputs = document.querySelectorAll('.rubric-input');
        for (let i = 0; i < inputs.length; i++) {
            let inp = inputs[i];
            let label = inp.parentElement.querySelector('label').innerText;
            let val = parseFloat(inp.value);
            let maxVal = parseFloat(inp.getAttribute('max'));

            if (isNaN(val) || val < 0 || val > maxVal) {
                isInvalid = true;
                invalidMsg = `คะแนนหัวข้อ "${label}" ไม่ถูกต้อง!\n(กรุณาระบุตัวเลขระหว่าง 0 ถึง ${maxVal} เท่านั้นครับ)`;
                break;
            }
            subScoresList.push(val); 
        }

        if (isInvalid) return Swal.fire('ข้อมูลไม่ถูกต้อง', invalidMsg, 'error');

        Swal.fire({
            title: 'ยืนยันการให้คะแนน?',
            text: "ระบบจะบันทึกคะแนนลงในฐานข้อมูลทันที",
            icon: 'question',
            showCancelButton: true, confirmButtonColor: '#f97316', cancelButtonColor: '#9ca3af', confirmButtonText: 'ยืนยันบันทึก', cancelButtonText: 'ยกเลิก'
        }).then((result) => {
            if (result.isConfirmed) {
                let payload = {
                    action: "submitScore", teacherId: currentTeacherId || "คุณครู",
                    logId: req.logId, studentId: req.studentId, studentName: req.studentName,
                    category: req.category, subCategory: req.subCategory, detail: req.detail,
                    subScoresList: subScoresList,
                    remark: document.getElementById("remark1").value
                };

                Swal.fire({ title: 'กำลังประมวลผล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                
                fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
                .then(res => res.json()).then(data => {
                    if(data.status === "success") {
                        Swal.fire('สำเร็จ!', 'บันทึกคะแนนเรียบร้อย', 'success').then(() => window.location.reload());
                    } else { Swal.fire('ผิดพลาด', data.message, 'error'); }
                }).catch(() => Swal.fire('ผิดพลาด', 'ไม่สามารถติดต่อ Server ได้', 'error'));
            }
        });
    }

    function rejectRequest() {
        if(currentSelectedIndex === -1) return;
        let req = pendingRequests[currentSelectedIndex];

        Swal.fire({
            title: 'ปฏิเสธคำขอนี้?',
            text: "ระบบจะแจ้งเตือนให้นักเรียนทราบ กรุณาระบุเหตุผล",
            input: 'text',
            icon: 'warning',
            showCancelButton: true, confirmButtonColor: '#ef4444', cancelButtonColor: '#9ca3af', confirmButtonText: 'ยืนยันปฏิเสธ', cancelButtonText: 'ยกเลิก', inputPlaceholder: 'เช่น ภาพไม่ชัด, ส่งผิดหัวข้อ...',
            inputValidator: (value) => { if (!value) return 'กรุณาระบุเหตุผลด้วยครับ!' }
        }).then((result) => {
            if (result.isConfirmed) {
                Swal.fire({ title: 'กำลังดำเนินการ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                let payload = { action: "rejectRequest", logId: req.logId, studentId: req.studentId, category: req.category, subCategory: req.subCategory, reason: result.value };

                fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
                .then(res => res.json()).then(data => {
                    if(data.status === "success") { Swal.fire('สำเร็จ', data.message, 'success').then(() => window.location.reload()); } 
                    else { Swal.fire('ผิดพลาด', data.message, 'error'); }
                }).catch(() => Swal.fire('ผิดพลาด', 'ไม่สามารถติดต่อ Server ได้', 'error'));
            }
        });
    }

        else if (h.category === "สอบปฏิบัติ") {
            if (h.subCategory.includes("OPG")) {
                html += `<div style="background: #fff7ed; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #ffedd5; text-align: left;"><h4 style="margin: 0 0 10px 0; color: #c2410c; font-size: 14px; display: flex; align-items: center; gap: 8px;"><i class="fa-solid fa-stethoscope" style="color: #ec4899;"></i> สอบ OPG</h4><div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px dashed #fed7aa; padding-bottom: 8px;"><label style="margin: 0; font-weight: 500; flex: 1; font-size: 13px; color: #4b5563;">เตรียมเครื่องมือ/ผู้ป่วย</label><input type="number" class="edit-sub-score rubric-input-edit" value="${sub[0]||''}" max="2"></div><div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px dashed #fed7aa; padding-bottom: 8px;"><label style="margin: 0; font-weight: 500; flex: 1; font-size: 13px; color: #4b5563;">จัดท่าผู้ป่วย/ถ่ายภาพ</label><input type="number" class="edit-sub-score rubric-input-edit" value="${sub[1]||''}" max="5"></div><div style="display: flex; justify-content: space-between; align-items: center;"><label style="margin: 0; font-weight: 500; flex: 1; font-size: 13px; color: #4b5563;">การดูภาพ/แก้ไขปัญหา</label><input type="number" class="edit-sub-score rubric-input-edit" value="${sub[2]||''}" max="3"></div></div>`;
            } else if (h.subCategory.includes("เรียงภาพ FM")) {
                html += `<div style="background: #fff7ed; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #ffedd5; text-align: left;"><h4 style="margin: 0 0 10px 0; color: #c2410c; font-size: 14px; display: flex; align-items: center; gap: 8px;"><i class="fa-solid fa-images" style="color: #ec4899;"></i> สอบเรียงภาพ FM</h4><div style="display: flex; justify-content: space-between; align-items: center;"><label style="margin: 0; font-weight: 500; flex: 1; font-size: 13px; color: #4b5563;">คะแนนสอบเรียงภาพ</label><input type="number" class="edit-sub-score rubric-input-edit" value="${sub[0]||''}" max="5"></div></div>`;
            } else {
                html += `<div style="background: #fff7ed; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #ffedd5; text-align: left;"><h4 style="margin: 0 0 10px 0; color: #c2410c; font-size: 14px; display: flex; align-items: center; gap: 8px;"><i class="fa-solid fa-tooth" style="color: #ec4899;"></i> สอบปฏิบัติทั่วไป</h4><div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px dashed #fed7aa; padding-bottom: 8px;"><label style="margin: 0; font-weight: 500; flex: 1; font-size: 13px; color: #4b5563;">เตรียมเครื่องมือ</label><input type="number" class="edit-sub-score rubric-input-edit" value="${sub[0]||''}" max="5"></div><div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px dashed #fed7aa; padding-bottom: 8px;"><label style="margin: 0; font-weight: 500; flex: 1; font-size: 13px; color: #4b5563;">เตรียมผู้ป่วย</label><input type="number" class="edit-sub-score rubric-input-edit" value="${sub[1]||''}" max="5"></div><div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px dashed #fed7aa; padding-bottom: 8px;"><label style="margin: 0; font-weight: 500; flex: 1; font-size: 13px; color: #4b5563;">ถ่ายภาพรังสี</label><input type="number" class="edit-sub-score rubric-input-edit" value="${sub[2]||''}" max="10"></div><div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px dashed #fed7aa; padding-bottom: 8px;"><label style="margin: 0; font-weight: 500; flex: 1; font-size: 13px; color: #4b5563;">ดูแลเครื่องมือหลังใช้</label><input type="number" class="edit-sub-score rubric-input-edit" value="${sub[3]||''}" max="5"></div><div style="display: flex; justify-content: space-between; align-items: center;"><label style="margin: 0; font-weight: 500; flex: 1; font-size: 13px; color: #4b5563;">ประเมิน/แก้ไขภาพ</label><input type="number" class="edit-sub-score rubric-input-edit" value="${sub[4]||''}" max="5"></div></div>`;
            }
        }

        html += `<style> .rubric-input-edit { width: 70px; text-align: center; padding: 6px; border: 1px solid #fed7aa; border-radius: 8px; font-family: 'Prompt'; outline: none; font-size:14px; background: white; font-weight: 600; color: #ea580c; } .rubric-input-edit:focus { border-color: #f97316; box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.2); } </style>`;
        html += `<div style="text-align:left; font-size:13px; font-weight:600; margin-top:10px; color:#475569;">เหตุผลการแก้ไข</div><input id="swal-remark" class="swal2-input" placeholder="เช่น เด็กทำผลงานเพิ่ม..." style="margin-top:5px; max-width:100%; height:40px; font-size:14px; border-radius:8px;">`;

        Swal.fire({
            title: 'แก้ไขคะแนน', html: html, showCancelButton: true, confirmButtonText: 'บันทึกคะแนนใหม่', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#ea580c', cancelButtonColor: '#94a3b8', customClass: { popup: 'swal-wide', title: 'swal-title-custom' }, 
            preConfirm: () => {
                let inputs = document.querySelectorAll('.edit-sub-score');
                let subScoresList = [], isInvalid = false, invalidMsg = "";
                for (let i = 0; i < inputs.length; i++) {
                    let inp = inputs[i], label = inp.parentElement.querySelector('label').innerText, val = parseFloat(inp.value), maxVal = parseFloat(inp.getAttribute('max'));
                    if (isNaN(val) || val < 0 || val > maxVal) { isInvalid = true; invalidMsg = `คะแนนหัวข้อ "${label}" ไม่ถูกต้อง! (ต้องอยู่ระหว่าง 0 ถึง ${maxVal})`; break; }
                    subScoresList.push(val);
                }
                if (isInvalid) { Swal.showValidationMessage(invalidMsg); return false; }
                return { subScores: subScoresList, remark: document.getElementById('swal-remark').value }
            }
        }).then((res) => {
            if(res.isConfirmed) {
                Swal.fire({title: 'กำลังอัปเดต...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
                fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "editScore", logId: h.logId, category: h.category, subCategory: h.subCategory, detail: h.detail, subScoresList: res.value.subScores, newRemark: res.value.remark }) })
                .then(r => r.json()).then(data => {
                    if(data.status === "success") Swal.fire('สำเร็จ', data.message, 'success').then(() => window.location.reload());
                    else Swal.fire('ผิดพลาด', data.message, 'error');
                });
            }
        });
    }

    function revokeScore(logId) {
        Swal.fire({
            title: 'ดึงงานกลับมารอประเมิน?', text: "คะแนนเดิมจะถูกลบทิ้ง และสถานะงานของเด็กจะกลับไปเป็น 'รอประเมิน' อีกครั้ง", icon: 'warning', showCancelButton: true, confirmButtonColor: '#b91c1c', cancelButtonColor: '#94a3b8', confirmButtonText: 'ยืนยันดึงงานกลับ', cancelButtonText: 'ยกเลิก', customClass: { popup: 'swal-wide', title: 'swal-title-custom' }
        }).then((res) => {
            if(res.isConfirmed) {
                Swal.fire({title: 'กำลังยกเลิก...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
                fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "revokeScore", logId: logId }) })
                .then(r => r.json()).then(data => {
                    if(data.status === "success") Swal.fire('สำเร็จ', data.message, 'success').then(() => window.location.reload());
                    else Swal.fire('ผิดพลาด', data.message, 'error');
                });
            }
        });
    }

    function openEditModal() {
        Swal.fire({
            title: 'แก้ไขชื่อ-นามสกุล',
            html: `<div style="text-align: left; font-size: 13px; margin-bottom: 5px; font-weight: 500; color: #4b5563;">ชื่อ-นามสกุลคุณครู</div><input id="swal-tname" class="swal2-input" value="${currentTeacherName}" style="margin-top:0; max-width:90%; border-radius:8px;">`,
            showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#ea580c', customClass: { popup: 'swal-wide', title: 'swal-title-custom' },
            preConfirm: () => { return document.getElementById('swal-tname').value.trim(); }
        }).then((result) => {
            if(result.isConfirmed && result.value) {
                Swal.fire({title:'กำลังบันทึก...', allowOutsideClick: false, didOpen:()=>Swal.showLoading()});
                liff.getProfile().then(profile => {
                    fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'updateProfile', role: 'teacher', userId: profile.userId, fullName: result.value }) })
                    .then(r=>r.json()).then(data=>{ if(data.status==='success') Swal.fire('สำเร็จ', 'อัปเดตชื่อเรียบร้อย', 'success').then(()=>window.location.reload()); });
                });
            }
        });
    }
</script>
</body>
</html>
