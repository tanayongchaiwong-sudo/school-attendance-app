<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ศูนย์บริการนักเรียน</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        :root { --primary: #4f46e5; --bg: #f3f4f6; --text: #1f2937; --border: #d1d5db; }
        body { font-family: 'Prompt', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: var(--text); display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .header { text-align: center; margin-bottom: 20px; position: relative; }
        .header i { font-size: 35px; color: var(--primary); margin-bottom: 5px; }
        .header h2 { margin: 0; font-size: 20px; font-weight: 600; }
        
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .menu-btn { background: white; border: 2px solid #f3f4f6; padding: 15px 10px; border-radius: 16px; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .menu-btn:hover { border-color: var(--c); background: #f8fafc; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .menu-btn i { font-size: 28px; color: var(--c); }
        .menu-btn span { font-family: 'Prompt'; font-size: 13px; font-weight: 500; color: #334155; }

        .form-group { margin-bottom: 15px; }
        label { font-size: 13px; font-weight: 600; margin-bottom: 6px; display: block; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #9ca3af; }
        input, select { width: 100%; padding: 12px 14px 12px 40px; font-family: 'Prompt', sans-serif; font-size: 14px; border: 1px solid var(--border); border-radius: 10px; background-color: #f9fafb; transition: 0.3s; box-sizing: border-box;}
        input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); background: white; }
        
        .btn-primary { width: 100%; padding: 14px; font-family: 'Prompt'; font-weight: 600; font-size: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 15px; display: flex; justify-content: center; gap: 8px; transition: 0.3s;}
        .btn-back { position: absolute; left: 0; top: 0; background: none; border: none; color: #64748b; font-size: 18px; cursor: pointer; padding: 5px; }
        
        .hidden { display: none !important; }
        .gps-box { background: #eff6ff; padding: 10px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #bfdbfe; font-size: 12px; }
        .gps-btn { width: 100%; padding: 8px; font-family: 'Prompt'; background: white; border: 1px solid var(--primary); color: var(--primary); border-radius: 8px; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div id="step1">
        <div class="header">
            <i class="fa-solid fa-graduation-cap"></i>
            <h2>ศูนย์บริการนักเรียน</h2>
            <p style="font-size: 14px; color: #6b7280; margin-top: 5px;">กรุณาเลือกรายการที่ต้องการทำ</p>
        </div>

        <div class="menu-grid">
            <button class="menu-btn" style="--c: #3b82f6;" onclick="selectCategory('ลงเวลาเข้า-ออก')">
                <i class="fa-solid fa-clock-rotate-left"></i><span>ลงเวลาเข้า-ออก</span>
            </button>
            <button class="menu-btn" style="--c: #10b981;" onclick="selectCategory('ส่งใบงาน')">
                <i class="fa-solid fa-file-arrow-up"></i><span>ส่งใบงาน</span>
            </button>
            <button class="menu-btn" style="--c: #f59e0b;" onclick="selectCategory('สอบปฏิบัติ')">
                <i class="fa-solid fa-stethoscope"></i><span>สอบปฏิบัติ</span>
            </button>
            <button class="menu-btn" style="--c: #8b5cf6;" onclick="selectCategory('สอบประเมินภาพ')">
                <i class="fa-solid fa-x-ray"></i><span>สอบประเมินภาพ</span>
            </button>
            <button class="menu-btn" style="--c: #ec4899; grid-column: span 2;" onclick="selectCategory('สอบเข้าห้อง (Pre-Clinic)')">
                <i class="fa-solid fa-laptop-file"></i><span>สอบเข้าห้อง (Pre-Clinic)</span>
            </button>
        </div>
    </div>

    <div id="step2" class="hidden">
        <div class="header">
            <button class="btn-back" onclick="goBack()"><i class="fa-solid fa-chevron-left"></i></button>
            <h2 id="formTitle" style="color: var(--primary);">หัวข้อที่เลือก</h2>
        </div>

        <input type="hidden" id="category">

        <div class="form-group">
            <label>รหัสประจำตัวนักเรียน</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-id-card"></i>
                <input type="number" id="studentId" placeholder="กรอกรหัสนักเรียน" onblur="checkName()">
            </div>
        </div>
        <div class="form-group">
            <label>ชื่อ-นามสกุล</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="fullName" readonly placeholder="ระบบจะดึงชื่ออัตโนมัติ">
            </div>
        </div>

        <hr style="border: 0; border-top: 1px dashed #e5e7eb; margin: 20px 0;">

        <div class="form-group" id="divSubCategory">
            <label id="lblSubCategory">เลือกหัวข้อ</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-tag"></i>
                <select id="subCategory" onchange="updateDetail()"></select>
            </div>
        </div>

        <div class="form-group hidden" id="divDetail">
            <label id="lblDetail">รายละเอียดเพิ่มเติม</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-bars-staggered"></i>
                <select id="detail"></select>
            </div>
        </div>

        <div class="form-group hidden" id="divTeacher">
            <label>ส่งถึงคุณครูผู้ประเมิน</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-chalkboard-user"></i>
                <select id="teacherId">
                    <option value="" disabled selected>-- กำลังโหลดรายชื่อครู... --</option>
                </select>
            </div>
        </div>

        <div class="gps-box hidden" id="divGps">
            <label style="margin-bottom: 2px;"><i class="fa-solid fa-location-dot"></i> พิกัด GPS (บังคับ)</label>
            <input type="text" id="location" readonly placeholder="กำลังค้นหาพิกัด..." style="margin-bottom: 5px; border:none; padding:5px 10px; background: transparent;">
            <button class="gps-btn" onclick="verifyLocation()">ตรวจสอบพิกัดเป้าหมาย</button>
            <div id="locationStatus" style="margin-top: 5px; font-weight: 600;"></div>
        </div>

        <div class="form-group" id="divRemark">
            <label>หมายเหตุ (ถ้ามี)</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-comment-dots"></i>
                <input type="text" id="remark" placeholder="พิมพ์ข้อความเพิ่มเติม...">
            </div>
        </div>

        <button class="btn-primary" id="btnSubmit" onclick="submitForm()">
            <i id="btnSubmitIcon" class="fa-solid fa-paper-plane"></i> 
            <span id="btnSubmitText">ยืนยันการส่งข้อมูล</span>
        </button>
    </div>
</div>

<script>
    // 🚨 ใส่ LIFF ID และ API URL
    const LIFF_ID = "2011162626-lcdf4ybN"; 
    const API_URL = "https://script.google.com/macros/s/AKfycbxZ_QTWpnCGkwMO85TQOysJyR0L9LNggOpK3cAhH4udynOR4yHIJBPf0KjlmaI8tpx-/exec"; 

    // ตัวแปรเก็บประวัติการสอบ (ดึงมาจาก Google Sheets)
    let studentCompletedExams = [];

    // โครงสร้างข้อมูลแบบฉลาด (เพิ่มหมวดสอบเข้าห้อง และลิงก์)
    const formData = {
        "ลงเวลาเข้า-ออก": {
            options: { "เข้างาน": [], "ออกงาน": ["ฟิล์มนอกช่องปาก", "ฟิล์มในช่องปาก", "ฟิล์มผู้ป่วยนอกเวลา"] },
            subLabel: "สถานะ", detailLabel: "เวรปฏิบัติงาน (เฉพาะออกงาน)"
        },
        "ส่งใบงาน": {
            options: { "นอกช่องปาก": ["ใบงานที่ 1", "ใบงานที่ 2", "ใบงานที่ 3"], "ในช่องปาก": ["ใบงานที่ 1", "ใบงานที่ 2", "ใบงานที่ 3"] },
            subLabel: "หมวดหมู่ใบงาน", detailLabel: "เลือกใบงานที่ส่ง"
        },
        "สอบปฏิบัติ": {
            options: { 
                "สอบถ่ายนอกช่องปาก (OPG)": ["ครั้งที่ 1", "ครั้งที่ 2", "ครั้งที่ 3"],
                "Pa (Anterior)": ["ครั้งที่ 1", "ครั้งที่ 2", "ครั้งที่ 3"],
                "Pa (Posterior)": ["ครั้งที่ 1", "ครั้งที่ 2", "ครั้งที่ 3"],
                "Bite Wing": ["ครั้งที่ 1", "ครั้งที่ 2", "ครั้งที่ 3"],
                "สอบเรียงภาพ FM": ["ครั้งที่ 1", "ครั้งที่ 2", "ครั้งที่ 3"]
            },
            subLabel: "เลือกหัวข้อการสอบ", detailLabel: "ครั้งที่สอบ"
        },
        "สอบประเมินภาพ": {
            options: {}, 
            subLabel: "", detailLabel: ""
        },
        // 🌟 หมวดหมู่ใหม่: สอบเข้าห้อง พร้อมลิงก์ไป Google Forms (คุณเปลี่ยนลิงก์ได้เลย)
        "สอบเข้าห้อง (Pre-Clinic)": {
            options: { "Part 1": [], "Part 2": [], "Part 3": [] },
            subLabel: "เลือกหัวข้อที่ต้องการสอบ", detailLabel: "",
            links: {
                "Part 1": "https://liff.line.me/2011162626-TL70LvNp",
                "Part 2": "https://forms.gle/ลิ้งก์ข้อสอบพาร์ท2",
                "Part 3": "https://forms.gle/ลิ้งก์ข้อสอบพาร์ท3"
            }
        }
    };

    window.onload = function() {
        liff.init({ liffId: LIFF_ID });
        fetchTeachersList();
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                p => document.getElementById("location").value = p.coords.latitude + "," + p.coords.longitude,
                e => document.getElementById("location").value = "ไม่สามารถดึงพิกัดได้"
            );
        }
    };

    function selectCategory(cat) {
        document.getElementById("category").value = cat;
        document.getElementById("formTitle").innerText = cat;
        document.getElementById("step1").classList.add("hidden");
        document.getElementById("step2").classList.remove("hidden");
        updateForm();
    }

    function goBack() {
        document.getElementById("step2").classList.add("hidden");
        document.getElementById("step1").classList.remove("hidden");
        document.getElementById("subCategory").innerHTML = "";
        document.getElementById("detail").innerHTML = "";
        document.getElementById("divDetail").classList.add("hidden");
    }

    function fetchTeachersList() {
        fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getTeachersList" }) })
        .then(res => res.json()).then(data => {
            let select = document.getElementById("teacherId");
            select.innerHTML = '<option value="" disabled selected>-- เลือกคุณครู --</option>';
            data.data.forEach(t => select.innerHTML += `<option value="${t.id}">${t.name}</option>`);
        });
    }

    function checkName() {
        let sid = document.getElementById("studentId").value;
        if(sid) {
            fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getStudentName", studentId: sid }) })
            .then(res => res.json()).then(data => {
                if(data.status === "success") {
                    document.getElementById("fullName").value = data.fullName;
                    // 🌟 เก็บประวัติว่าพาร์ทไหนที่เคยสอบแล้ว
                    studentCompletedExams = data.completedExams || []; 
                    updateForm(); // โหลดฟอร์มใหม่เพื่ออัปเดตตัวเลือก
                } else {
                    document.getElementById("fullName").value = "ไม่พบรหัสนี้";
                    studentCompletedExams = [];
                }
            });
        }
    }

    // 🌟 จัดการซ่อน/แสดงช่อง และจัดการปุ่มลิงก์ข้อสอบ
    function updateForm() {
        let cat = document.getElementById("category").value;
        let subSelect = document.getElementById("subCategory");
        
        // รีเซ็ตปุ่มเป็นค่าเริ่มต้น (สีม่วง)
        let btnSubmit = document.getElementById("btnSubmit");
        let btnText = document.getElementById("btnSubmitText");
        let btnIcon = document.getElementById("btnSubmitIcon");
        btnText.innerText = "ยืนยันการส่งข้อมูล";
        btnIcon.className = "fa-solid fa-paper-plane";
        btnSubmit.style.background = "var(--primary)";

        if (cat === "สอบประเมินภาพ") {
            document.getElementById("divSubCategory").classList.add("hidden");
            document.getElementById("divDetail").classList.add("hidden");
            subSelect.innerHTML = '<option value="สอบประเมินภาพ" selected>สอบประเมินภาพ</option>';
            document.getElementById("detail").innerHTML = ""; 
            
            document.getElementById("divGps").classList.add("hidden");
            document.getElementById("divTeacher").classList.remove("hidden");
            document.getElementById("divRemark").classList.remove("hidden");
            
        } else if (cat === "สอบเข้าห้อง (Pre-Clinic)") {
            // 🌟 กรณีสอบเข้าห้อง
            document.getElementById("lblSubCategory").innerText = formData[cat].subLabel;
            subSelect.innerHTML = '<option value="" disabled selected>-- เลือก --</option>';
            
            // กรองพาร์ทที่เคยทำไปแล้วออก
            let availableOptions = Object.keys(formData[cat].options).filter(opt => !studentCompletedExams.includes(opt));
            
            if (availableOptions.length === 0) {
                subSelect.innerHTML = '<option value="" disabled selected>✅ คุณสอบครบทุก Part แล้ว</option>';
            } else {
                availableOptions.forEach(opt => subSelect.innerHTML += `<option value="${opt}">${opt}</option>`);
            }

            document.getElementById("divSubCategory").classList.remove("hidden");
            document.getElementById("divDetail").classList.add("hidden"); 
            document.getElementById("divGps").classList.add("hidden");
            document.getElementById("divTeacher").classList.add("hidden"); // ไม่ต้องเลือกครู
            document.getElementById("divRemark").classList.add("hidden"); // ไม่ต้องมีหมายเหตุ

            // เปลี่ยนหน้าตาปุ่มเป็น "เปิดลิงก์ทำข้อสอบ" (สีชมพู)
            btnText.innerText = "เปิดลิงก์ทำข้อสอบ";
            btnIcon.className = "fa-solid fa-arrow-up-right-from-square";
            btnSubmit.style.background = "#ec4899"; 

        } else {
            // กรณีอื่นๆ (ลงเวลา / สอบปฏิบัติ / ใบงาน)
            document.getElementById("lblSubCategory").innerText = formData[cat].subLabel;
            subSelect.innerHTML = '<option value="" disabled selected>-- เลือก --</option>';
            Object.keys(formData[cat].options).forEach(opt => subSelect.innerHTML += `<option value="${opt}">${opt}</option>`);
            
            document.getElementById("divSubCategory").classList.remove("hidden");
            document.getElementById("divDetail").classList.add("hidden"); 
            document.getElementById("divGps").classList.toggle("hidden", cat !== "ลงเวลาเข้า-ออก");
            document.getElementById("divTeacher").classList.remove("hidden");
            document.getElementById("divRemark").classList.remove("hidden");
            
            if(cat === "ลงเวลาเข้า-ออก") document.getElementById("divTeacher").classList.add("hidden");
        }
    }

    function updateDetail() {
        let cat = document.getElementById("category").value;
        if (cat === "สอบประเมินภาพ" || cat === "สอบเข้าห้อง (Pre-Clinic)") return; // ข้ามไป

        let sub = document.getElementById("subCategory").value;
        let detailArr = formData[cat].options[sub];
        let detailSelect = document.getElementById("detail");

        if(cat === "ลงเวลาเข้า-ออก" && sub === "เข้างาน") document.getElementById("divTeacher").classList.add("hidden");
        else document.getElementById("divTeacher").classList.remove("hidden");

        if(detailArr && detailArr.length > 0) {
            document.getElementById("lblDetail").innerText = formData[cat].detailLabel;
            detailSelect.innerHTML = '<option value="" disabled selected>-- เลือก --</option>';
            detailArr.forEach(d => detailSelect.innerHTML += `<option value="${d}">${d}</option>`);
            document.getElementById("divDetail").classList.remove("hidden");
        } else {
            detailSelect.innerHTML = "";
            document.getElementById("divDetail").classList.add("hidden");
        }
    }

    function verifyLocation() {
        let loc = document.getElementById("location").value;
        let stat = document.getElementById("locationStatus");
        stat.style.color = "#4f46e5"; stat.innerText = "กำลังตรวจสอบ...";
        fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "checkLocation", location: loc }) })
        .then(res => res.json()).then(data => {
            stat.style.color = data.status === "success" ? "#059669" : "#dc2626";
            stat.innerText = data.message;
        });
    }

    function submitForm() {
        let cat = document.getElementById("category").value;
        let sub = document.getElementById("subCategory").value;
        let studentId = document.getElementById("studentId").value;
        let fullName = document.getElementById("fullName").value;

        if(!studentId || !fullName || fullName === "ไม่พบรหัสนี้" || fullName === "กำลังค้นหา...") return Swal.fire('แจ้งเตือน', 'กรุณากรอกรหัสนักเรียนให้ถูกต้องก่อนครับ', 'warning');

        // 🌟 ดักจับถ้าเป็นปุ่ม "สอบเข้าห้อง" (ให้เปิดลิงก์ Google Form ไปเลย ไม่ต้องส่งข้อมูลไป Server)
        if (cat === "สอบเข้าห้อง (Pre-Clinic)") {
            if (!sub || sub.includes("สอบครบทุก Part")) return Swal.fire('แจ้งเตือน', 'กรุณาเลือก Part ที่ต้องการสอบครับ', 'warning');
            
            let link = formData[cat].links[sub];
            if (link && link.startsWith("http")) {
                window.open(link, '_blank');
            } else {
                Swal.fire('แจ้งเตือน', 'ยังไม่ได้ตั้งค่าลิงก์ข้อสอบในระบบครับ', 'info');
            }
            return; // ⛔️ จบการทำงานตรงนี้ ไม่ต้องส่งลง Google Sheets
        }

        // กรณีส่งคำขออื่นๆ ปกติ
        let payload = {
            action: "submitStudentRequest",
            studentId: studentId,
            category: cat,
            subCategory: sub,
            detail: document.getElementById("detail").value,
            teacherId: document.getElementById("teacherId").value,
            location: document.getElementById("location").value,
            remark: document.getElementById("remark").value,
            submitterUid: ""
        };

        if(!payload.category || !payload.subCategory) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกหมวดหมู่ให้ครบถ้วนครับ', 'warning');
        if(!document.getElementById("divDetail").classList.contains("hidden") && !payload.detail) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกรายละเอียดเพิ่มเติมครับ', 'warning');
        if(!document.getElementById("divTeacher").classList.contains("hidden") && !payload.teacherId) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกคุณครูผู้ประเมินครับ', 'warning');

        Swal.fire({ title: 'กำลังส่งข้อมูล...', didOpen: () => Swal.showLoading() });

        if (typeof liff !== 'undefined' && liff.isLoggedIn()) {
            liff.getProfile().then(p => { payload.submitterUid = p.userId; sendData(payload); }).catch(() => sendData(payload));
        } else sendData(payload);
    }

    function sendData(payload) {
        fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
        .then(res => res.json()).then(data => {
            if(data.status === "success") Swal.fire({ icon: 'success', title: 'สำเร็จ', text: data.message }).then(() => {
                if (typeof liff !== 'undefined' && liff.isInClient()) liff.closeWindow(); 
                else window.location.reload();
            });
            else if (data.status === "buddy_detected" || data.status === "out_of_bounds") {
                Swal.fire({
                    title: 'แจ้งเตือน', text: data.message, icon: 'warning', input: 'text', showCancelButton: true, confirmButtonText: 'ยืนยัน',
                    inputValidator: (v) => !v ? 'กรุณาระบุเหตุผล' : null
                }).then(res => {
                    if (res.isConfirmed) {
                        if(data.status === "buddy_detected") { payload.forceBuddy = true; payload.buddyReason = res.value; }
                        if(data.status === "out_of_bounds") { payload.forceOutOfBounds = true; payload.outOfBoundsReason = res.value; }
                        Swal.fire({ title: 'กำลังส่ง...', didOpen: () => Swal.showLoading() });
                        sendData(payload);
                    }
                });
            } else Swal.fire('ผิดพลาด', data.message, 'error');
        }).catch(() => Swal.fire('ผิดพลาด', 'ไม่สามารถติดต่อ Server ได้', 'error'));
    }
</script>
