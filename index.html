<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ศูนย์บริการนักเรียน</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        :root { --primary: #4f46e5; --bg: #f3f4f6; --text: #1f2937; --border: #d1d5db; }
        body { font-family: 'Prompt', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: var(--text); display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .header { text-align: center; margin-bottom: 20px; position: relative; }
        .header i { font-size: 35px; color: var(--primary); margin-bottom: 5px; }
        .header h2 { margin: 0; font-size: 20px; font-weight: 600; }
        
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .menu-btn { background: white; border: 2px solid #f3f4f6; padding: 15px 10px; border-radius: 16px; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .menu-btn:hover { border-color: var(--c); background: #f8fafc; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .menu-btn i { font-size: 28px; color: var(--c); }
        .menu-btn span { font-family: 'Prompt'; font-size: 13px; font-weight: 500; color: #334155; text-align: center;}

        .form-group { margin-bottom: 15px; }
        label { font-size: 13px; font-weight: 600; margin-bottom: 6px; display: block; color: #4b5563;}
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #9ca3af; transition: 0.3s; }
        input, select { width: 100%; padding: 12px 14px 12px 40px; font-family: 'Prompt', sans-serif; font-size: 14px; border: 1px solid var(--border); border-radius: 10px; background-color: #f9fafb; transition: 0.3s; box-sizing: border-box;}
        input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); background: white; }
        
        .btn-primary { width: 100%; padding: 14px; font-family: 'Prompt'; font-weight: 600; font-size: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 15px; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.3s;}
        .btn-back { position: absolute; left: 0; top: 0; background: none; border: none; color: #64748b; font-size: 18px; cursor: pointer; padding: 5px; }
        
        /* 🌟 สไตล์ปุ่มสอบเข้าห้องโดยเฉพาะ */
        .exam-btn { background: white; border: 2px solid #fce7f3; padding: 15px; border-radius: 16px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); width: 100%; text-align: left; }
        .exam-btn:hover { border-color: #f472b6; background: #fdf2f8; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(236, 72, 153, 0.1); }
        .exam-btn-icon { width: 45px; height: 45px; background: #fce7f3; color: #ec4899; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .exam-btn-content { flex: 1; }
        .exam-btn-title { font-family: 'Prompt'; font-size: 14px; font-weight: 600; color: #be185d; margin-bottom: 2px; }
        .exam-btn-desc { font-family: 'Prompt'; font-size: 11px; color: #64748b; line-height: 1.3; }

        .hidden { display: none !important; }
        .gps-box { background: #eff6ff; padding: 10px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #bfdbfe; font-size: 12px; }
        .gps-btn { width: 100%; padding: 8px; font-family: 'Prompt'; background: white; border: 1px solid var(--primary); color: var(--primary); border-radius: 8px; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div id="step1">
        <div class="header">
            <i class="fa-solid fa-graduation-cap"></i>
            <h2>ศูนย์บริการนักเรียน</h2>
            <p style="font-size: 14px; color: #6b7280; margin-top: 5px;">กรุณาเลือกรายการที่ต้องการทำ</p>
        </div>

        <div class="menu-grid">
            <button class="menu-btn" style="--c: #3b82f6;" onclick="selectCategory('ลงเวลาเข้า-ออก')">
                <i class="fa-solid fa-clock-rotate-left"></i><span>ลงเวลาเข้า-ออก / ลา</span>
            </button>
            <button class="menu-btn" style="--c: #10b981;" onclick="selectCategory('ส่งใบงาน')">
                <i class="fa-solid fa-file-arrow-up"></i><span>ส่งใบงาน</span>
            </button>
            <button class="menu-btn" style="--c: #f59e0b;" onclick="selectCategory('สอบปฏิบัติ')">
                <i class="fa-solid fa-stethoscope"></i><span>สอบปฏิบัติ</span>
            </button>
            <button class="menu-btn" style="--c: #8b5cf6;" onclick="selectCategory('สอบประเมินภาพ')">
                <i class="fa-solid fa-x-ray"></i><span>สอบประเมินภาพ</span>
            </button>
            <button class="menu-btn" id="btnPreClinic" style="--c: #ec4899; grid-column: span 2;" onclick="selectCategory('สอบเข้าห้อง (Pre-Clinic)')">
                <i class="fa-solid fa-laptop-file"></i><span>สอบเข้าห้อง (Pre-Clinic)</span>
            </button>
        </div>
    </div>

    <div id="step2" class="hidden">
        <div class="header">
            <button class="btn-back" onclick="goBack()"><i class="fa-solid fa-chevron-left"></i></button>
            <h2 id="formTitle" style="color: var(--primary);">หัวข้อที่เลือก</h2>
        </div>

        <input type="hidden" id="category">

        <div class="form-group">
            <label>รหัสประจำตัวนักเรียน</label>
            <div class="input-wrapper">
                <i id="idIcon" class="fa-solid fa-id-card"></i>
                <!-- 🌟 เพิ่ม debounce ให้เริ่มค้นหาชื่อหลังพิมพ์เสร็จ 1 วินาที -->
                <input type="number" id="studentId" placeholder="กรอกรหัสนักเรียน" onkeyup="debounceCheckName()" onchange="checkName()">
            </div>
        </div>
        <div class="form-group">
            <label>ชื่อ-นามสกุล</label>
            <div class="input-wrapper">
                <i id="nameIcon" class="fa-solid fa-user"></i>
                <input type="text" id="fullName" readonly placeholder="รอพิมพ์รหัสประจำตัว...">
            </div>
        </div>

        <hr style="border: 0; border-top: 1px dashed #e5e7eb; margin: 20px 0;">

        <div id="divPreClinicButtons" class="hidden" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;">
            <!-- โค้ดปุ่มจะถูกสร้างอัตโนมัติตรงนี้ -->
        </div>

        <div class="form-group" id="divSubCategory">
            <label id="lblSubCategory">เลือกหัวข้อ</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-tag"></i>
                <select id="subCategory" onchange="updateDetail()"></select>
            </div>
        </div>

        <div class="form-group hidden" id="divDetail">
            <label id="lblDetail">รายละเอียดเพิ่มเติม</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-bars-staggered"></i>
                <select id="detail"></select>
            </div>
        </div>

        <div class="form-group hidden" id="divTeacher">
            <label>ส่งถึงคุณครูผู้ประเมิน</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-chalkboard-user"></i>
                <select id="teacherId">
                    <option value="" disabled selected>-- กำลังโหลดรายชื่อครู... --</option>
                </select>
            </div>
        </div>

        <div class="gps-box hidden" id="divGps">
            <label style="margin-bottom: 2px;"><i class="fa-solid fa-location-dot"></i> พิกัด GPS (บังคับ)</label>
            <input type="text" id="location" readonly placeholder="กำลังค้นหาพิกัด..." style="margin-bottom: 5px; border:none; padding:5px 10px; background: transparent; width:100%;">
            <button class="gps-btn" onclick="verifyLocation()">ตรวจสอบพิกัดเป้าหมาย</button>
            <div id="locationStatus" style="margin-top: 5px; font-weight: 600;"></div>
        </div>

        <div class="form-group" id="divRemark">
            <label>หมายเหตุ (ถ้ามี)</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-comment-dots"></i>
                <input type="text" id="remark" placeholder="พิมพ์ข้อความเพิ่มเติม...">
            </div>
        </div>

        <button class="btn-primary" id="btnSubmit" onclick="submitForm()">
            <i id="btnSubmitIcon" class="fa-solid fa-paper-plane"></i> 
            <span id="btnSubmitText">ยืนยันการส่งข้อมูล</span>
        </button>
    </div>
</div>

<script>
    // 🚨 1. ใส่ LIFF ID (ของหน้าศูนย์บริการนักเรียน)
    const LIFF_ID = "2011162626-lcdf4ybN"; 
    // 🚨 2. ใส่ API URL 
    const API_URL = "https://script.google.com/macros/s/AKfycbxZ_QTWpnCGkwMO85TQOysJyR0L9LNggOpK3cAhH4udynOR4yHIJBPf0KjlmaI8tpx-/exec"; 

    let studentCompletedExams = [];
    let studentSubmittedTasks = []; 
    let typingTimer; // ตัวแปรสำหรับหน่วงเวลาพิมพ์

    const formData = {
        "ลงเวลาเข้า-ออก": {
            // 🌟 เพิ่มหมวด "ลา" เข้าไป
            options: { "เข้างาน": [], "ออกงาน": ["ฟิล์มนอกช่องปาก", "ฟิล์มในช่องปาก", "ฟิล์มผู้ป่วยนอกเวลา"], "ลา": [] },
            subLabel: "สถานะ", detailLabel: "เวรปฏิบัติงาน (เฉพาะออกงาน)"
        },
        "ส่งใบงาน": {
            options: { "นอกช่องปาก": ["ใบงานที่ 1", "ใบงานที่ 2", "ใบงานที่ 3"], "ในช่องปาก": ["ใบงานที่ 1", "ใบงานที่ 2", "ใบงานที่ 3"] },
            subLabel: "หมวดหมู่ใบงาน", detailLabel: "เลือกใบงานที่ส่ง"
        },
        "สอบปฏิบัติ": {
            options: { 
                "สอบถ่ายนอกช่องปาก (OPG)": ["ครั้งที่ 1", "ครั้งที่ 2", "ครั้งที่ 3"],
                "Pa (Anterior)": ["ครั้งที่ 1", "ครั้งที่ 2", "ครั้งที่ 3"],
                "Pa (Posterior)": ["ครั้งที่ 1", "ครั้งที่ 2", "ครั้งที่ 3"],
                "Bite Wing": ["ครั้งที่ 1", "ครั้งที่ 2", "ครั้งที่ 3"],
                "สอบเรียงภาพ FM": ["ครั้งที่ 1", "ครั้งที่ 2", "ครั้งที่ 3"]
            },
            subLabel: "เลือกหัวข้อการสอบ", detailLabel: "ครั้งที่สอบ"
        },
        "สอบประเมินภาพ": {
            options: {}, 
            subLabel: "", detailLabel: ""
        },
        "สอบเข้าห้อง (Pre-Clinic)": {
            options: { 
                "Part 1: การใช้เครื่องมือ-อุปกรณ์การถ่ายภาพรังสีในช่องปาก": [], 
                "Part 2: ขั้นตอนการถ่ายภาพรังสีชนิดในช่องปาก": [], 
                "Part 3: ขั้นตอนการถ่ายภาพรังสีชนิดนอกช่องปาก": [] 
            },
            subLabel: "เลือกหัวข้อที่ต้องการสอบ", detailLabel: "",
            links: {
                // 🚨 3. อย่าลืมนำลิงก์หน้าข้อสอบ (exam.html) มาใส่ตรงนี้นะครับ
                "Part 1: การใช้เครื่องมือ-อุปกรณ์การถ่ายภาพรังสีในช่องปาก": "https://liff.line.me/2011162626-TL70LvNp?part=Part 1",
                "Part 2: ขั้นตอนการถ่ายภาพรังสีชนิดในช่องปาก": "https://liff.line.me/2011162626-TL70LvNp?part=Part 2",
                "Part 3: ขั้นตอนการถ่ายภาพรังสีชนิดนอกช่องปาก": "https://liff.line.me/2011162626-TL70LvNp?part=Part 3"
            }
        }
    };

    window.onload = function() {
        liff.init({ liffId: LIFF_ID }).then(() => {
            if (liff.isLoggedIn()) {
                liff.getProfile().then(p => {
                    // ทันทีที่โหลดหน้า ให้โชว์ว่ากำลังประมวลผลดึงรหัส
                    let nameInput = document.getElementById("fullName");
                    let nameIcon = document.getElementById("nameIcon");
                    nameInput.placeholder = "กำลังดึงข้อมูลส่วนตัว... ⏳";
                    nameIcon.className = "fa-solid fa-spinner fa-spin";
                    nameIcon.style.color = "#3b82f6";

                    fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getStudentDashboard", studentUid: p.userId }) })
                    .then(res => res.json()).then(data => {
                        if(data.status === "success") {
                            document.getElementById("studentId").value = data.data.studentId;
                            checkName(); 
                        } else {
                            resetNameStatus();
                        }
                    });
                });
            } else {
                liff.login();
            }
        });
        fetchTeachersList();
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                p => document.getElementById("location").value = p.coords.latitude + "," + p.coords.longitude,
                e => document.getElementById("location").value = "ไม่สามารถดึงพิกัดได้"
            );
        }
    };

    function selectCategory(cat) {
        document.getElementById("category").value = cat;
        document.getElementById("formTitle").innerText = cat;
        document.getElementById("step1").classList.add("hidden");
        document.getElementById("step2").classList.remove("hidden");
        updateForm();
    }

    function goBack() {
        document.getElementById("step2").classList.add("hidden");
        document.getElementById("step1").classList.remove("hidden");
        document.getElementById("subCategory").innerHTML = "";
        document.getElementById("detail").innerHTML = "";
        document.getElementById("divDetail").classList.add("hidden");
        document.getElementById("divPreClinicButtons").classList.add("hidden");
    }

    function fetchTeachersList() {
        fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getTeachersList" }) })
        .then(res => res.json()).then(data => {
            let select = document.getElementById("teacherId");
            select.innerHTML = '<option value="" disabled selected>-- เลือกคุณครู --</option>';
            data.data.forEach(t => select.innerHTML += `<option value="${t.id}">${t.name}</option>`);
        });
    }

    // 🌟 ฟังก์ชันจัดการ UI การค้นหาชื่อนักเรียน
    function debounceCheckName() {
        clearTimeout(typingTimer);
        let nameInput = document.getElementById("fullName");
        let nameIcon = document.getElementById("nameIcon");
        nameInput.value = "";
        nameInput.placeholder = "รอพิมพ์รหัสเสร็จ...";
        nameIcon.className = "fa-solid fa-user";
        nameIcon.style.color = "#9ca3af";
        typingTimer = setTimeout(checkName, 1000); // รอผู้ใช้หยุดพิมพ์ 1 วินาทีแล้วค่อยหา
    }

    function resetNameStatus() {
        let nameInput = document.getElementById("fullName");
        let nameIcon = document.getElementById("nameIcon");
        nameInput.value = "";
        nameInput.placeholder = "กรุณากรอกรหัสด้วยตนเอง ✍️";
        nameIcon.className = "fa-solid fa-triangle-exclamation";
        nameIcon.style.color = "#f59e0b";
    }

    function checkName() {
        let sid = document.getElementById("studentId").value;
        let nameInput = document.getElementById("fullName");
        let nameIcon = document.getElementById("nameIcon");
        
        if(!sid) {
            resetNameStatus();
            return;
        }

        nameInput.value = "";
        nameInput.placeholder = "กำลังค้นหาข้อมูล... ⏳";
        nameIcon.className = "fa-solid fa-spinner fa-spin";
        nameIcon.style.color = "#3b82f6";

        fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getStudentName", studentId: sid }) })
        .then(res => res.json()).then(data => {
            if(data.status === "success") {
                nameInput.value = data.fullName;
                nameIcon.className = "fa-solid fa-circle-check";
                nameIcon.style.color = "#10b981";
                
                studentCompletedExams = data.completedExams || []; 
                studentSubmittedTasks = data.submittedTasks || []; 

                let hasP1 = studentCompletedExams.includes("Part 1") || studentCompletedExams.includes("Part 1: การใช้เครื่องมือ-อุปกรณ์การถ่ายภาพรังสีในช่องปาก");
                let hasP2 = studentCompletedExams.includes("Part 2") || studentCompletedExams.includes("Part 2: ขั้นตอนการถ่ายภาพรังสีชนิดในช่องปาก");
                let hasP3 = studentCompletedExams.includes("Part 3") || studentCompletedExams.includes("Part 3: ขั้นตอนการถ่ายภาพรังสีชนิดนอกช่องปาก");
                
                let btnPreClinic = document.getElementById("btnPreClinic");
                if (hasP1 && hasP2 && hasP3) {
                    if (btnPreClinic) btnPreClinic.classList.add("hidden");
                } else {
                    if (btnPreClinic) btnPreClinic.classList.remove("hidden");
                }
                updateForm(); 
            } else {
                nameInput.placeholder = "ไม่พบรหัสนี้ กรุณาแก้ไข ❌";
                nameIcon.className = "fa-solid fa-triangle-exclamation";
                nameIcon.style.color = "#ef4444";
                
                studentCompletedExams = [];
                studentSubmittedTasks = [];
                let btnPreClinic = document.getElementById("btnPreClinic");
                if (btnPreClinic) btnPreClinic.classList.remove("hidden");
            }
        }).catch(() => {
            nameInput.placeholder = "ระบบขัดข้อง ลองพิมพ์ใหม่อีกครั้ง";
            nameIcon.className = "fa-solid fa-triangle-exclamation";
            nameIcon.style.color = "#ef4444";
        });
    }

    function updateForm() {
        let cat = document.getElementById("category").value;
        let subSelect = document.getElementById("subCategory");
        let btnSubmit = document.getElementById("btnSubmit");
        
        // รีเซ็ตการแสดงผลพื้นฐาน
        btnSubmit.classList.remove("hidden");
        document.getElementById("divPreClinicButtons").classList.add("hidden");
        document.getElementById("btnSubmitText").innerText = "ยืนยันการส่งข้อมูล";
        document.getElementById("btnSubmitIcon").className = "fa-solid fa-paper-plane";
        btnSubmit.style.background = "var(--primary)";

        if (cat === "สอบประเมินภาพ") {
            document.getElementById("divSubCategory").classList.add("hidden");
            document.getElementById("divDetail").classList.add("hidden");
            
            let isSubmitted = studentSubmittedTasks.includes("สอบประเมินภาพ|สอบประเมินภาพ|");
            if (isSubmitted) {
                subSelect.innerHTML = '<option value="" disabled selected>✅ ส่งคำขอไปแล้ว (รอตรวจ/มีคะแนนแล้ว)</option>';
                btnSubmit.classList.add("hidden");
                document.getElementById("divTeacher").classList.add("hidden");
                document.getElementById("divRemark").classList.add("hidden");
            } else {
                subSelect.innerHTML = '<option value="สอบประเมินภาพ" selected>สอบประเมินภาพ</option>';
                btnSubmit.classList.remove("hidden");
                document.getElementById("divTeacher").classList.remove("hidden");
                document.getElementById("divRemark").classList.remove("hidden");
            }
            
            document.getElementById("detail").innerHTML = ""; 
            document.getElementById("divGps").classList.add("hidden");
            
        } else if (cat === "สอบเข้าห้อง (Pre-Clinic)") {
            document.getElementById("divSubCategory").classList.add("hidden");
            document.getElementById("divDetail").classList.add("hidden"); 
            document.getElementById("divGps").classList.add("hidden");
            document.getElementById("divTeacher").classList.add("hidden"); 
            document.getElementById("divRemark").classList.add("hidden"); 
            btnSubmit.classList.add("hidden"); 

            let btnContainer = document.getElementById("divPreClinicButtons");
            btnContainer.classList.remove("hidden");
            btnContainer.innerHTML = '<label style="margin-bottom: 5px;">เลือกหัวข้อที่ต้องการสอบ</label>';

            let availableOptions = Object.keys(formData[cat].options).filter(opt => {
                let shortOpt = opt.split(":")[0].trim();
                return !studentCompletedExams.includes(shortOpt) && !studentCompletedExams.includes(opt);
            });
            
            if (availableOptions.length === 0) {
                btnContainer.innerHTML += '<div style="text-align:center; padding:15px; background:#ecfdf5; color:#059669; border-radius:10px; font-weight:600;"><i class="fa-solid fa-circle-check"></i> ✅ คุณสอบครบทุก Part แล้วครับ!</div>';
            } else {
                availableOptions.forEach(opt => {
                    let link = formData[cat].links[opt];
                    let shortName = opt.split(":")[0].trim(); 
                    let descName = opt.split(":")[1] ? opt.split(":")[1].trim() : ""; 
                    
                    btnContainer.innerHTML += `
                        <button class="exam-btn" onclick="window.location.href='${link}'">
                            <div class="exam-btn-icon"><i class="fa-solid fa-laptop-code"></i></div>
                            <div class="exam-btn-content">
                                <div class="exam-btn-title">สอบเข้าห้อง ${shortName}</div>
                                <div class="exam-btn-desc">${descName}</div>
                            </div>
                            <i class="fa-solid fa-chevron-right" style="color: #cbd5e1; font-size: 16px;"></i>
                        </button>
                    `;
                });
            }

        } else {
            document.getElementById("lblSubCategory").innerText = formData[cat].subLabel;
            subSelect.innerHTML = '<option value="" disabled selected>-- เลือก --</option>';
            
            let hasAvailableOption = false;
            Object.keys(formData[cat].options).forEach(opt => {
                if (cat === "สอบปฏิบัติ" && studentCompletedExams.includes(opt)) return; 
                subSelect.innerHTML += `<option value="${opt}">${opt}</option>`;
                hasAvailableOption = true;
            });
            
            if (!hasAvailableOption && cat !== "ลงเวลาเข้า-ออก") {
                 subSelect.innerHTML = '<option value="" disabled selected>✅ ส่งครบทุกรายการแล้ว</option>';
                 btnSubmit.classList.add("hidden");
                 document.getElementById("divTeacher").classList.add("hidden");
                 document.getElementById("divRemark").classList.add("hidden");
            } else {
                 btnSubmit.classList.remove("hidden");
                 document.getElementById("divTeacher").classList.remove("hidden");
                 document.getElementById("divRemark").classList.remove("hidden");
                 if(cat === "ลงเวลาเข้า-ออก") document.getElementById("divTeacher").classList.add("hidden");
            }

            document.getElementById("divSubCategory").classList.remove("hidden");
            document.getElementById("divDetail").classList.add("hidden"); 
            document.getElementById("divGps").classList.toggle("hidden", cat !== "ลงเวลาเข้า-ออก");
        }
    }

    function updateDetail() {
        let cat = document.getElementById("category").value;
        if (cat === "สอบประเมินภาพ" || cat === "สอบเข้าห้อง (Pre-Clinic)") return; 

        let sub = document.getElementById("subCategory").value;
        if (!sub) return;

        let detailArr = formData[cat].options[sub];
        let detailSelect = document.getElementById("detail");
        let btnSubmit = document.getElementById("btnSubmit");

        // 🌟 ดักจับระบบการลา ไม่เอาครู ไม่เอา GPS
        if (cat === "ลงเวลาเข้า-ออก") {
            if (sub === "ลา") {
                document.getElementById("divTeacher").classList.add("hidden");
                document.getElementById("divGps").classList.add("hidden");
                document.getElementById("btnSubmitText").innerText = "ส่งคำขอลา";
                document.getElementById("btnSubmitIcon").className = "fa-solid fa-bed";
                btnSubmit.style.background = "#ef4444"; 
            } else if (sub === "เข้างาน") {
                document.getElementById("divTeacher").classList.add("hidden");
                document.getElementById("divGps").classList.remove("hidden");
                document.getElementById("btnSubmitText").innerText = "ยืนยันการลงเวลา";
                document.getElementById("btnSubmitIcon").className = "fa-solid fa-clock";
                btnSubmit.style.background = "var(--primary)";
            } else {
                document.getElementById("divTeacher").classList.remove("hidden");
                document.getElementById("divGps").classList.remove("hidden");
                document.getElementById("btnSubmitText").innerText = "ยืนยันการลงเวลา";
                document.getElementById("btnSubmitIcon").className = "fa-solid fa-clock";
                btnSubmit.style.background = "var(--primary)";
            }
        }

        if(detailArr && detailArr.length > 0) {
            document.getElementById("lblDetail").innerText = formData[cat].detailLabel;
            detailSelect.innerHTML = '<option value="" disabled selected>-- เลือก --</option>';
            detailArr.forEach(d => detailSelect.innerHTML += `<option value="${d}">${d}</option>`);
            btnSubmit.classList.remove("hidden");
            document.getElementById("divDetail").classList.remove("hidden");
        } else {
            detailSelect.innerHTML = "";
            document.getElementById("divDetail").classList.add("hidden");
        }
    }

    function verifyLocation() {
        let loc = document.getElementById("location").value;
        let stat = document.getElementById("locationStatus");
        stat.style.color = "#4f46e5"; stat.innerText = "กำลังตรวจสอบ...";
        fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "checkLocation", location: loc }) })
        .then(res => res.json()).then(data => {
            stat.style.color = data.status === "success" ? "#059669" : "#dc2626";
            stat.innerText = data.message;
        });
    }

    function submitForm() {
        let cat = document.getElementById("category").value;
        let sub = document.getElementById("subCategory").value;
        let sId = document.getElementById("studentId").value;
        let fullName = document.getElementById("fullName").value;

        if(!sId || !fullName || fullName.includes("ไม่พบ")) return Swal.fire('แจ้งเตือน', 'กรุณากรอกรหัสนักเรียนให้ถูกต้องก่อนครับ', 'warning');

        // 🌟 1. ดักจับกรณีกดลา (ให้เด้ง Popup บังคับใส่เหตุผล)
        if (cat === "ลงเวลาเข้า-ออก" && sub === "ลา") {
            Swal.fire({
                title: 'ระบุเหตุผลการลา',
                input: 'text',
                inputPlaceholder: 'เช่น เป็นไข้, ธุระครอบครัว, ลากิจ',
                showCancelButton: true,
                confirmButtonText: '<i class="fa-solid fa-paper-plane"></i> ส่งข้อมูลวันลา',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#ef4444',
                inputValidator: (value) => {
                    if (!value) return 'กรุณาระบุเหตุผลการลาด้วยครับ!';
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    let payload = {
                        action: "submitStudentRequest",
                        studentId: sId,
                        category: cat,
                        subCategory: sub,
                        detail: "-",
                        teacherId: "",
                        location: "",
                        remark: result.value, // เหตุผลที่เด็กเพิ่งพิมพ์
                        submitterUid: ""
                    };
                    executeSubmit(payload);
                }
            });
        } 
        // 🌟 2. ดักจับกรณีปกติ (เช็คข้อมูลตามปกติ)
        else {
            let payload = {
                action: "submitStudentRequest",
                studentId: sId,
                category: cat,
                subCategory: sub,
                detail: document.getElementById("detail").value,
                teacherId: document.getElementById("teacherId").value,
                location: document.getElementById("location").value,
                remark: document.getElementById("remark").value,
                submitterUid: ""
            };

            if(!payload.category || !payload.subCategory) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกหมวดหมู่ให้ครบถ้วนครับ', 'warning');
            if(!document.getElementById("divDetail").classList.contains("hidden") && !payload.detail) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกรายละเอียดเพิ่มเติมครับ', 'warning');
            if(!document.getElementById("divTeacher").classList.contains("hidden") && !payload.teacherId) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกคุณครูผู้ประเมินครับ', 'warning');
            if(!document.getElementById("divGps").classList.contains("hidden") && (!payload.location || payload.location === "กำลังค้นหาพิกัด...")) return Swal.fire('แจ้งเตือน', 'กรุณารอระบบตรวจสอบพิกัด GPS ก่อนครับ', 'warning');

            executeSubmit(payload);
        }
    }

    function executeSubmit(payload) {
        Swal.fire({ title: 'กำลังส่งข้อมูล...', didOpen: () => Swal.showLoading() });
        if (typeof liff !== 'undefined' && liff.isLoggedIn()) {
            liff.getProfile().then(p => { payload.submitterUid = p.userId; sendData(payload); }).catch(() => sendData(payload));
        } else sendData(payload);
    }

    function sendData(payload) {
        fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
        .then(res => res.json()).then(data => {
            if(data.status === "success") {
                Swal.fire({ icon: 'success', title: 'สำเร็จ', text: data.message }).then(() => {
                    if (typeof liff !== 'undefined' && liff.isInClient()) liff.closeWindow(); 
                    else window.location.reload();
                });
            }
            else if (data.status === "buddy_detected" || data.status === "out_of_bounds") {
                Swal.fire({
                    title: 'แจ้งเตือน', text: data.message, icon: 'warning', input: 'text', showCancelButton: true, confirmButtonText: 'ยืนยัน',
                    inputValidator: (v) => !v ? 'กรุณาระบุเหตุผล' : null
                }).then(res => {
                    if (res.isConfirmed) {
                        if(data.status === "buddy_detected") { payload.forceBuddy = true; payload.buddyReason = res.value; }
                        if(data.status === "out_of_bounds") { payload.forceOutOfBounds = true; payload.outOfBoundsReason = res.value; }
                        Swal.fire({ title: 'กำลังส่ง...', didOpen: () => Swal.showLoading() });
                        sendData(payload);
                    }
                });
            } else Swal.fire('ผิดพลาด', data.message, 'error');
        }).catch(() => Swal.fire('ผิดพลาด', 'ไม่สามารถติดต่อ Server ได้', 'error'));
    }
</script>
