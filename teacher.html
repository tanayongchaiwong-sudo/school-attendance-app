<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบประเมินคะแนน (คุณครู)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        :root { --primary: #f97316; --primary-hover: #ea580c; --bg: #f3f4f6; --text: #1f2937; --border: #e5e7eb; }
        body { font-family: 'Prompt', sans-serif; background-color: var(--bg); margin: 0; padding: 15px; color: var(--text); }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        .header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px dashed var(--border); position: relative;}
        .header i { font-size: 35px; color: var(--primary); margin-bottom: 10px;}
        .header h2 { margin: 0; font-size: 20px; font-weight: 600; color: #9a3412;}
        .header p { margin: 5px 0 0; font-size: 13px; color: #6b7280; background: #ffedd5; display: inline-block; padding: 4px 12px; border-radius: 20px;}

        /* สไตล์การ์ดงาน (Task Card) */
        .task-list { display: flex; flex-direction: column; gap: 12px; }
        .task-card { background: #ffffff; border: 1px solid var(--border); border-radius: 12px; padding: 15px; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.02); position: relative; overflow: hidden;}
        .task-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--primary); }
        .task-card:hover { transform: translateY(-3px); box-shadow: 0 8px 15px rgba(249, 115, 22, 0.1); border-color: #fdba74; }
        .task-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;}
        .task-name { font-size: 15px; font-weight: 600; color: #1f2937; }
        .task-time { font-size: 11px; color: #9ca3af; }
        .task-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px;}
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .b-cat { background: #e0e7ff; color: #4338ca; }
        .b-sub { background: #fef3c7; color: #d97706; }
        .task-detail { font-size: 12px; color: #6b7280; }

        /* สไตล์ฟอร์มประเมิน */
        .btn-back { background: none; border: none; font-size: 15px; color: #6b7280; cursor: pointer; display: flex; align-items: center; gap: 6px; margin-bottom: 20px; padding: 0; font-family: 'Prompt'; font-weight: 500; transition: 0.2s;}
        .btn-back:hover { color: var(--primary); }
        
        .student-info-box { background: #fff7ed; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #ffedd5; display: flex; align-items: center; gap: 15px;}
        .student-avatar { width: 50px; height: 50px; background: #fdba74; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px;}
        .student-name-display { font-size: 16px; font-weight: 600; color: #9a3412; margin-bottom: 2px;}
        .student-task-display { font-size: 12px; color: #c2410c; }

        .rubric-box { background: #ffffff; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--border); box-shadow: 0 2px 5px rgba(0,0,0,0.02);}
        .rubric-box h4 { margin: 0 0 15px 0; color: #1f2937; font-size: 14px; display: flex; align-items: center; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid var(--border);}
        .rubric-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .rubric-row:last-child { margin-bottom: 0; }
        .rubric-row label { margin: 0; font-weight: 500; flex: 1; font-size: 13px; color: #4b5563;}
        .rubric-row input[type="number"] { width: 70px; text-align: center; padding: 8px; border: 2px solid #e5e7eb; border-radius: 8px; font-family: 'Prompt'; outline: none; font-size: 14px; background: #f9fafb; font-weight: 600; color: var(--primary); transition: 0.2s;}
        .rubric-row input[type="number"]:focus { border-color: var(--primary); background: white; }

        .form-group { margin-top: 20px; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #4b5563; }
        .form-group input[type="text"] { width: 100%; padding: 12px; font-family: 'Prompt'; font-size: 14px; border: 2px solid var(--border); border-radius: 10px; background-color: #f9fafb; box-sizing: border-box; transition: 0.3s;}
        .form-group input:focus { outline: none; border-color: var(--primary); background: white; }

        .btn-primary { padding: 12px 10px; font-family: 'Prompt'; font-weight: 600; font-size: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 6px;}
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(249, 115, 22, 0.3);}
        
        .empty-state { text-align: center; padding: 40px 20px; color: #9ca3af; }
        .empty-state i { font-size: 45px; margin-bottom: 15px; color: #d1d5db;}
        
        .hidden { display: none !important; }
        .swal-wide { width: 95% !important; max-width: 500px !important; border-radius: 16px; }
    </style>
</head>
<body>

<div class="container" id="loadingDiv" style="text-align: center; padding: 50px 20px;">
    <i class="fa-solid fa-spinner fa-spin" style="font-size: 45px; color: #f97316; margin-bottom: 15px;"></i>
    <p style="font-size: 15px; color: #4b5563;">กำลังเชื่อมต่อระบบ...</p>
</div>

<div class="container hidden" id="mainContainer">
    
    <!-- 📋 Step 1: หน้ารายการงาน (Task List) -->
    <div id="step1List">
        <div class="header">
            <i class="fa-solid fa-clipboard-check"></i>
            <h2>รายการรอประเมิน</h2>
            <p>เลือกการ์ดนักเรียนเพื่อให้คะแนน</p>
        </div>

        <div id="emptyState" class="empty-state hidden">
            <i class="fa-solid fa-mug-hot"></i>
            <p style="font-size: 15px; font-weight: 500; color: #6b7280; margin:0;">พักผ่อนได้เลยครับ! ไม่มีงานค้างแล้ว</p>
        </div>

        <div class="task-list" id="taskListArea"></div>
    </div>

    <!-- 📝 Step 2: หน้าฟอร์มให้คะแนน (Evaluation Form) -->
    <div id="step2Form" class="hidden">
        <button class="btn-back" onclick="goBackToList()"><i class="fa-solid fa-arrow-left"></i> กลับหน้ารายการ</button>
        
        <div id="studentInfoArea"></div>
        <div id="dynamicRubricArea"></div>

        <div class="form-group">
            <label><i class="fa-solid fa-comment-dots"></i> หมายเหตุ / ข้อเสนอแนะ (ถ้ามี)</label>
            <input type="text" id="remark1" placeholder="พิมพ์คำติชมเพื่อการพัฒนา...">
        </div>

        <!-- 🌟 ปุ่ม 3 ปุ่ม: บันทึก | ส่งต่อ(สีฟ้า) | ปฏิเสธ(สีแดง) -->
        <div style="display: flex; gap: 8px; margin-top: 25px;">
            <button class="btn-primary" style="flex: 1.2;" onclick="submitPendingScore()">
                <i class="fa-solid fa-floppy-disk"></i> บันทึก
            </button>
            <button class="btn-primary" style="background: #3b82f6; flex: 1;" onclick="reassignRequest()">
                <i class="fa-solid fa-share"></i> ส่งต่อครูอื่น
            </button>
            <button class="btn-primary" style="background: #ef4444; flex: 0.8;" onclick="rejectRequest()">
                <i class="fa-solid fa-xmark"></i> ปฏิเสธ
            </button>
        </div>
    </div>

</div>

<script>
    // 🚨 1. ใส่ LIFF ID หน้าประเมินครูตรงนี้
    const LIFF_ID = "2011162626-dON8ee2c"; 
    // 🚨 2. ใส่ API URL
    const API_URL = "https://script.google.com/macros/s/AKfycbzPyR4k6rVOrBFIB4QiBYBO9ntaY0mWpo7mck4RTzeV-rWpWLa-mRviLfuyG8lH62s/exec"; 

    let currentTeacherId = "";
    let pendingRequests = [];
    let currentSelectedIndex = -1; 
    let globalTeachers = []; // 🌟 เก็บรายชื่อครูทั้งหมดสำหรับระบบ "ส่งต่อ"

    window.onload = function() {
        liff.init({ liffId: LIFF_ID }).then(() => {
            if (liff.isLoggedIn()) {
                liff.getProfile().then(p => { 
                    fetchPendingRequests(p.userId); 
                    fetchTeachersList(); // โหลดรายชื่อครู
                });
            } else {
                liff.login();
            }
        }).catch(() => {
            Swal.fire('ผิดพลาด', 'ไม่สามารถเชื่อมต่อ LINE LIFF ได้', 'error');
        });
    };

    function fetchTeachersList() {
        fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getTeachersList" }) })
        .then(res => res.json()).then(data => {
            if(data.status === "success") globalTeachers = data.data;
        });
    }

    function fetchPendingRequests(uid) {
        fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getPendingRequests", teacherUid: uid }) })
        .then(res => res.json()).then(data => {
            document.getElementById("loadingDiv").classList.add("hidden");
            document.getElementById("mainContainer").classList.remove("hidden");

            if(data.status === "success") {
                currentTeacherId = data.teacherId;
                pendingRequests = data.data;
                renderTaskList();
            } else {
                Swal.fire('ผิดพลาด', data.message, 'error');
            }
        }).catch(() => {
            Swal.fire('ผิดพลาด', 'ไม่สามารถติดต่อ Server ได้', 'error');
        });
    }

    function renderTaskList() {
        if (pendingRequests.length === 0) {
            document.getElementById("taskListArea").classList.add("hidden");
            document.getElementById("emptyState").classList.remove("hidden");
        } else {
            document.getElementById("taskListArea").classList.remove("hidden");
            document.getElementById("emptyState").classList.add("hidden");
            
            let html = "";
            pendingRequests.forEach((req, idx) => {
                let detailHtml = req.detail ? `<div class="task-detail"><i class="fa-solid fa-bars-staggered"></i> รายละเอียด: ${req.detail}</div>` : "";
                
                html += `
                <div class="task-card" onclick="openEvaluationForm(${idx})">
                    <div class="task-header">
                        <div class="task-name">${req.studentName}</div>
                        <div class="task-time">${req.date}</div>
                    </div>
                    <div class="task-badges">
                        <span class="badge b-cat">${req.category}</span>
                        <span class="badge b-sub">${req.subCategory}</span>
                    </div>
                    ${detailHtml}
                </div>`;
            });
            document.getElementById("taskListArea").innerHTML = html;
        }
    }

    function openEvaluationForm(idx) {
        currentSelectedIndex = idx;
        let req = pendingRequests[idx];
        
        document.getElementById("step1List").classList.add("hidden");
        document.getElementById("step2Form").classList.remove("hidden");

        document.getElementById("studentInfoArea").innerHTML = `
            <div class="student-info-box">
                <div class="student-avatar"><i class="fa-solid fa-user-graduate"></i></div>
                <div>
                    <div class="student-name-display">${req.studentName}</div>
                    <div class="student-task-display">${req.category} - ${req.subCategory} ${req.detail ? '('+req.detail+')' : ''}</div>
                </div>
            </div>
        `;

        let html = '';
        if (req.category === "ประเมินรายวัน") {
            html += `<div class="rubric-box">
                <h4><i class="fa-solid fa-star" style="color: #eab308;"></i> พฤติกรรม (เต็ม 40)</h4>
                <div class="rubric-row"><label>ซื่อสัตย์ ตรงต่อเวลา</label><input type="number" class="b-score" placeholder="0-10" max="10"></div>
                <div class="rubric-row"><label>รับผิดชอบ กระตือรือร้น</label><input type="number" class="b-score" placeholder="0-10" max="10"></div>
                <div class="rubric-row"><label>ทำงานเป็นทีม เอื้อเฟื้อ</label><input type="number" class="b-score" placeholder="0-10" max="10"></div>
                <div class="rubric-row"><label>ปฏิภาณไหวพริบ คล่องแคล่ว</label><input type="number" class="b-score" placeholder="0-5" max="5"></div>
                <div class="rubric-row"><label>กิริยามารยาท แต่งกาย</label><input type="number" class="b-score" placeholder="0-5" max="5"></div>
            </div>
            <div class="rubric-box">
                <h4><i class="fa-solid fa-wrench" style="color: #3b82f6;"></i> ทักษะปฏิบัติงาน (เต็ม 20)</h4>
                <div class="rubric-row"><label>เตรียมเครื่อง/ห้อง</label><input type="number" class="s-score" placeholder="0-5" max="5"></div>
                <div class="rubric-row"><label>เตรียมผู้ป่วย</label><input type="number" class="s-score" placeholder="0-5" max="5"></div>
                <div class="rubric-row"><label>ถ่ายและประเมินภาพ</label><input type="number" class="s-score" placeholder="0-5" max="5"></div>
                <div class="rubric-row"><label>ดูแลอุปกรณ์หลังใช้</label><input type="number" class="s-score" placeholder="0-5" max="5"></div>
            </div>`;
        } 
        else if (req.category === "ส่งใบงาน") {
            let maxRaw = req.detail.includes("ที่ 1") ? 1 : 2; 
            html += `<div class="rubric-box">
                <h4><i class="fa-solid fa-file-pen" style="color: #8b5cf6;"></i> ประเมินใบงาน</h4>
                <div class="rubric-row"><label>คะแนนที่ได้</label><input type="number" class="raw-score" placeholder="0-${maxRaw}" max="${maxRaw}"></div>
            </div>`;
        }
        else if (req.category === "สอบปฏิบัติ") {
            if (req.subCategory.includes("OPG")) {
                html += `<div class="rubric-box"><h4><i class="fa-solid fa-stethoscope" style="color: #ec4899;"></i> สอบ OPG</h4>
                <div class="rubric-row"><label>เตรียมเครื่องมือ/ผู้ป่วย</label><input type="number" class="raw-score" placeholder="0-2" max="2"></div>
                <div class="rubric-row"><label>จัดท่าผู้ป่วย/ถ่ายภาพ</label><input type="number" class="raw-score" placeholder="0-5" max="5"></div>
                <div class="rubric-row"><label>การดูภาพ/แก้ไขปัญหา</label><input type="number" class="raw-score" placeholder="0-3" max="3"></div></div>`;
            } else if (req.subCategory.includes("เรียงภาพ FM")) {
                html += `<div class="rubric-box"><h4><i class="fa-solid fa-images" style="color: #ec4899;"></i> สอบเรียงภาพ FM</h4>
                <div class="rubric-row"><label>คะแนนสอบเรียงภาพ</label><input type="number" class="raw-score" placeholder="0-5" max="5"></div></div>`;
            } else {
                html += `<div class="rubric-box"><h4><i class="fa-solid fa-tooth" style="color: #ec4899;"></i> สอบ ${req.subCategory}</h4>
                <div class="rubric-row"><label>เตรียมเครื่องมือ</label><input type="number" class="raw-score" placeholder="0-5" max="5"></div>
                <div class="rubric-row"><label>เตรียมผู้ป่วย</label><input type="number" class="raw-score" placeholder="0-5" max="5"></div>
                <div class="rubric-row"><label>ถ่ายภาพรังสี</label><input type="number" class="raw-score" placeholder="0-10" max="10"></div>
                <div class="rubric-row"><label>ดูแลเครื่องมือหลังใช้</label><input type="number" class="raw-score" placeholder="0-5" max="5"></div>
                <div class="rubric-row"><label>ประเมิน/แก้ไขภาพ</label><input type="number" class="raw-score" placeholder="0-5" max="5"></div></div>`;
            }
        }
        else if (req.category === "สอบประเมินภาพ") {
            html += `<div class="rubric-box"><h4><i class="fa-solid fa-magnifying-glass" style="color: #14b8a6;"></i> สอบประเมินภาพ</h4>
                <div class="rubric-row"><label>วิเคราะห์ในช่องปาก</label><input type="number" class="raw-score" placeholder="0-5" max="5"></div>
                <div class="rubric-row"><label>วิเคราะห์นอกช่องปาก</label><input type="number" class="raw-score" placeholder="0-5" max="5"></div></div>`;
        }

        document.getElementById("dynamicRubricArea").innerHTML = html;
        document.getElementById("remark1").value = ""; 
    }

    function goBackToList() {
        currentSelectedIndex = -1;
        document.getElementById("step2Form").classList.add("hidden");
        document.getElementById("step1List").classList.remove("hidden");
    }

    // 🌟 ระบบส่งต่อคำขอให้ครูท่านอื่น (Reassign)
    function reassignRequest() {
        if(currentSelectedIndex === -1) return;
        let req = pendingRequests[currentSelectedIndex];

        let optionsHtml = '<option value="" disabled selected>-- เลือกคุณครูท่านใหม่ --</option>';
        globalTeachers.forEach(t => {
            // ป้องกันไม่ให้เลือกส่งต่อหาตัวเอง
            if (t.id !== currentTeacherId) {
                optionsHtml += `<option value="${t.id}">ครู${t.name}</option>`;
            }
        });

        Swal.fire({
            title: 'ส่งต่อให้คุณครูท่านอื่น',
            html: `
                <div style="font-size: 13px; color: #4b5563; margin-bottom: 15px; text-align:left; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0;">
                    <b>นักเรียน:</b> ${req.studentName}<br>
                    <b>เรื่อง:</b> ${req.category} - ${req.subCategory}
                </div>
                <div style="text-align: left; font-size: 13px; font-weight: 500; margin-bottom: 8px; color: #1f2937;">เลือกคุณครูที่ต้องการส่งต่อ:</div>
                <select id="swal-new-teacher" class="swal2-select" style="width: 100%; max-width: 100%; font-size: 14px; font-family: 'Prompt'; margin: 0 0 15px 0; display: block; border-radius: 8px; padding: 10px;">
                    ${optionsHtml}
                </select>
            `,
            showCancelButton: true,
            confirmButtonText: 'ยืนยันการส่งต่อ',
            cancelButtonText: 'ยกเลิก',
            confirmButtonColor: '#3b82f6',
            cancelButtonColor: '#94a3b8',
            customClass: { popup: 'swal-wide' },
            preConfirm: () => {
                let tid = document.getElementById('swal-new-teacher').value;
                if (!tid) {
                    Swal.showValidationMessage('กรุณาเลือกคุณครูปลายทางด้วยครับ');
                    return false;
                }
                return tid;
            }
        }).then((result) => {
            if(result.isConfirmed) {
                Swal.fire({title: 'กำลังส่งต่อ...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
                fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'resubmitRequest', logId: req.logId, newTeacherId: result.value })
                }).then(r => r.json()).then(data => {
                    if(data.status === 'success') {
                        Swal.fire('สำเร็จ', 'ส่งต่อคำขอให้คุณครูท่านใหม่เรียบร้อยแล้ว!', 'success').then(() => window.location.reload());
                    } else {
                        Swal.fire('ผิดพลาด', data.message, 'error');
                    }
                });
            }
        });
    }

    function submitPendingScore() {
        if(currentSelectedIndex === -1) return;
        
        let req = pendingRequests[currentSelectedIndex];
        let sumB = 0, sumS = 0, sumRaw = 0;
        let subScoresList = []; 
        let isInvalid = false;
        let invalidMsg = "";
        
        let inputs = document.querySelectorAll('.rubric-row input[type="number"]');
        for (let i = 0; i < inputs.length; i++) {
            let inp = inputs[i];
            let label = inp.parentElement.querySelector('label').innerText;
            let val = parseFloat(inp.value);
            let maxVal = parseFloat(inp.getAttribute('max'));

            if (isNaN(val) || val < 0 || val > maxVal) {
                isInvalid = true;
                invalidMsg = `คะแนนหัวข้อ "${label}" ไม่ถูกต้อง!\n(กรุณาระบุตัวเลขระหว่าง 0 ถึง ${maxVal} เท่านั้นครับ)`;
                break;
            }

            subScoresList.push(val); 
            if(inp.classList.contains('b-score')) sumB += val;
            if(inp.classList.contains('s-score')) sumS += val;
            if(inp.classList.contains('raw-score')) sumRaw += val;
        }

        if (isInvalid) return Swal.fire('ข้อมูลไม่ถูกต้อง', invalidMsg, 'error');

        Swal.fire({
            title: 'ยืนยันการให้คะแนน?',
            text: "ระบบจะบันทึกคะแนนลงในฐานข้อมูลทันที",
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#f97316',
            cancelButtonColor: '#9ca3af',
            confirmButtonText: 'ยืนยันบันทึก',
            cancelButtonText: 'ยกเลิก'
        }).then((result) => {
            if (result.isConfirmed) {
                let payload = {
                    action: "submitScore", teacherId: currentTeacherId,
                    logId: req.logId, studentId: req.studentId, studentName: req.studentName,
                    category: req.category, subCategory: req.subCategory, detail: req.detail,
                    behaviorScore: sumB, skillScore: sumS, rawScore: sumRaw,
                    subScoresList: subScoresList,
                    remark: document.getElementById("remark1").value
                };

                Swal.fire({ title: 'กำลังประมวลผล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                
                fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
                .then(res => res.json()).then(data => {
                    if(data.status === "success") {
                        Swal.fire('สำเร็จ!', 'บันทึกคะแนนเรียบร้อย', 'success').then(() => window.location.reload());
                    } else {
                        Swal.fire('ผิดพลาด', data.message, 'error');
                    }
                }).catch(() => Swal.fire('ผิดพลาด', 'ไม่สามารถติดต่อ Server ได้', 'error'));
            }
        });
    }

    function rejectRequest() {
        if(currentSelectedIndex === -1) return;
        let req = pendingRequests[currentSelectedIndex];

        Swal.fire({
            title: 'ปฏิเสธคำขอนี้?',
            text: "ระบบจะแจ้งเตือนให้นักเรียนทราบ กรุณาระบุเหตุผล",
            input: 'text',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            cancelButtonColor: '#9ca3af',
            confirmButtonText: 'ยืนยันปฏิเสธ',
            cancelButtonText: 'ยกเลิก',
            inputPlaceholder: 'เช่น ภาพไม่ชัด, ส่งผิดหัวข้อ...',
            inputValidator: (value) => {
                if (!value) return 'กรุณาระบุเหตุผลด้วยครับ!'
            }
        }).then((result) => {
            if (result.isConfirmed) {
                Swal.fire({ title: 'กำลังดำเนินการ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                
                let payload = {
                    action: "rejectRequest",
                    logId: req.logId,
                    studentId: req.studentId,
                    category: req.category,
                    subCategory: req.subCategory,
                    reason: result.value
                };

                fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
                .then(res => res.json()).then(data => {
                    if(data.status === "success") {
                        Swal.fire('สำเร็จ', data.message, 'success').then(() => window.location.reload());
                    } else {
                        Swal.fire('ผิดพลาด', data.message, 'error');
                    }
                }).catch(() => Swal.fire('ผิดพลาด', 'ไม่สามารถติดต่อ Server ได้', 'error'));
            }
        });
    }
</script>
